name: PR checks

# Runs the canonical check list (verify.yml) on every pull request, so a PR is
# reviewed against the same gates the deploy will apply. Replaces the old
# market-check.yml, which ran a four-step subset and left eight checks to run
# only after merge.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Unlike the deploy, superseded PR runs are worth cancelling — pushing twice
  # in quick succession should not queue two full Playwright installs.
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    # cross-repo-drift stays false here on purpose — see the step's comment in
    # verify.yml. It fails by design between a shared-module PR merging here and
    # the matching cookbook PR merging there.

  # TEMPORARY — manual-dispatch-only. PR #325 found check-visual-ratchet.js's
  # committed baselines (tools/visual-baselines/*.png) drifted from a few px
  # of Chromium/font-hinting change since they were last captured (an agent
  # sandbox can't reach Google Fonts, so it can't regenerate them correctly —
  # same constraint documented in premium-design-roadmap.md's P4). This job
  # re-baselines from inside real CI, which has real internet/font access,
  # and pushes the result straight back to this branch. Remove this job once
  # it's done its one job — it is not meant to be permanent infrastructure.
  rebaseline-visual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Re-baseline tools/visual-baselines/ from a real environment
        run: |
          npm install --no-save --prefix /tmp/pw-ci playwright@latest pixelmatch pngjs
          /tmp/pw-ci/node_modules/.bin/playwright install --with-deps chromium
          python3 -m http.server 8080 &
          SERVER_PID=$!
          for i in $(seq 1 20); do curl -sf http://localhost:8080/index.html >/dev/null && break; sleep 0.5; done
          NODE_PATH=/tmp/pw-ci/node_modules node tools/check-visual-ratchet.js http://localhost:8080 --update
          kill "$SERVER_PID" 2>/dev/null || true

      - name: Commit and push regenerated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- tools/visual-baselines/; then
            echo "No baseline drift measured from this environment — nothing to commit."
            exit 0
          fi
          git add tools/visual-baselines/
          git commit -m "Re-baseline tools/visual-baselines/ from real CI (PR #325 CI-drift fix)"
          git push origin HEAD:${{ github.ref }}
