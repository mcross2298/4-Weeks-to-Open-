name: Verify

# The canonical check list, called by both the PR path (pr.yml) and the deploy
# path (pages.yml) so a pull request runs exactly what the deploy will run.
#
# Before this existed, every gate lived inside pages.yml's deploy job, which
# only triggers on push to main — so all of them ran AFTER merge, and the only
# pull-request signal was market-check.yml's four-step subset. A PR could be
# reviewed and merged fully green while carrying a failure that surfaced by
# breaking the deploy.
#
# Not everything belongs on both paths. `cross-repo-drift` is opt-in for that
# reason (see the step's own comment) — the deploy passes true, PRs don't.

on:
  workflow_call:
    inputs:
      cross-repo-drift:
        description: >-
          Run the Mikes-Cookbook shared-module byte-identity check. Deploy-only
          by design; see the step comment for why it must not gate a PR.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JS syntax check (node --check)
        run: |
          fail=0
          for f in $(git ls-files '*.js'); do
            node --check "$f" || { echo "::error file=$f::JavaScript syntax error"; fail=1; }
          done
          exit $fail

      - name: Resolver / precedence unit tests
        run: node tools/test-naming.js

      - name: Validate program-overrides.json
        run: python3 tools/validate-overrides.py

      - name: Weight-math regression tests (real source, not a duplicated copy)
        run: |
          node tools/test-mc-suggest.js
          node tools/test-mc-maxout.js

      - name: Session energy/strain math regression tests (real source, not a duplicated copy)
        run: node tools/test-mc-strain.js

      - name: Muscle readiness math regression tests (real source, not a duplicated copy)
        run: node tools/test-mc-readiness.js

      - name: Quick Pump history-aware selection tests (real source, not a duplicated copy)
        # Promoted from manual-only (Phase 2 / Initiative 02): now that
        # mc-quick-pump.js's preferReadiness() calls into mc-readiness.js,
        # this is real integration surface, not just a Phase 2.4 leftover.
        run: node tools/test-mc-quick-pump.js

      - name: Cross-app bridge regression tests (mc-bridge.js read layer + mc-sync.js merge logic)
        run: |
          node tools/test-mc-bridge.js
          node tools/test-mc-sync-merge.js

      - name: Program day-progression tests (mc-program-progress.js + mc-program-tabs.js)
        # test-mc-program-progress.js shipped with D0-D3 but was never added to
        # a workflow, so its 68 assertions have not run in CI once. Wired here
        # alongside the F1 landing-tabs test, which builds on the same record.
        run: |
          node tools/test-mc-program-progress.js
          node tools/test-mc-program-tabs.js
          node tools/test-mc-program-day.js

      - name: Program schedule records match their source data (roadmap F5)
        # mm's and hv's `schedule` blocks in mc-pm-data.js are GENERATED from
        # mm-data.js and hv-block.html's own WEEKS. Hand-edited, they become a
        # second copy of the authored prescription, free to drift the moment a
        # program gains a week or a lift. Regenerate with:
        #   node tools/gen-schedules.js
        run: node tools/gen-schedules.js --check

      - name: Service-worker strategy test (stale-while-revalidate — audit LS-4)
        run: node tools/test-mc-sw.js

      - name: Service-worker precache freshness (committed sw.js matches the tree)
        # --check, not --version: the deploy regenerates sw.js with a run-scoped
        # cache version, but at review time we want to know the committed file
        # still lists the right URLs.
        run: python3 tools/build-sw.py --check

      - name: Script-manifest drift check (clone pages load identical module lists — audit LS-3)
        run: python3 tools/check-script-manifest.py --check


      - name: Page head-contract check (install meta + theme boot on every page — audit G-02/G-03)
        # Owns the <head> block and the mc-sw-update.js tail tag on all 140
        # deployable pages. Regenerate with: python3 tools/apply-head-contract.py
        run: python3 tools/apply-head-contract.py --check

      - name: Program color-sync check (mc-pm-data.js vs dashboard.html vs mc-theme.js)
        run: node tools/check-program-colors.js

      - name: Program-card CSS generation check (dashboard.html .cat-card/.rail-card vs mc-pm-data.js — DG-5)
        # Owns the four AUTOGEN:*-CARDS-* blocks in dashboard.html. Regenerate
        # with: python3 tools/gen-program-css.py
        run: python3 tools/gen-program-css.py --check

      - name: Day-card palette check (governed training colours — audit G-05)
        # Training days had 18 ad-hoc hexes with five near-duplicate clusters and
        # one reserved-recovery collision. Fold a new colour in with:
        # node tools/check-day-colors.js --fix
        run: node tools/check-day-colors.js

      - name: Multi-week program intensifier-coverage check (mm-p1/p2/p3.html)
        run: node tools/validate-programs.js

      - name: Global-namespace check (no NEW export conventions — audit G-09)
        # Grandfathers the existing MC_SNAKE / MCPascal split rather than
        # migrating 261 references of working code; fails only on a NEW export
        # outside MC_UPPER_SNAKE, or a baseline export that vanished.
        run: node tools/check-exports.js

      - name: Program-data conventions (note field + day taxonomy — audit G-07/G-10)
        # Fleet-wide where validate-programs.js only reaches 3 pages: one name
        # for exercise coaching text with readers that match it, a known day-type
        # vocabulary, and any page claiming the governed `5-on 2-off` schedule
        # label actually implementing that label's 7-day spec.
        run: node tools/check-program-data.js

      - name: Single rest-timer check (no orphan/duplicate/missing implementation — audit G5.0)
        # 27 pages once carried a dead second rest timer that never ran; 7 more
        # carried a LIVE second one (no mc-timer.js at all). Both are
        # indistinguishable from a working timer in source, so this is gated
        # rather than left to review.
        run: node tools/check-one-timer.js

      - name: Single-implementation check (shared functions must exist exactly once — Volume II Phase 4)
        # makeRestTimer had 6 behaviorally distinct bodies across 21 sites,
        # applyReplacements had 5, before Volume II Phase 4 collapsed them
        # onto mc-timer.js/mc-replace.js. This is the gate that stops a new
        # page-local copy of either from being reintroduced silently.
        run: node tools/check-single-impl.js

      - name: Store coverage check (store-registry.json vs mc-sync.js / mc-export.js — audit G-01/G-02)
        # Sync coverage, export coverage and the code's actual key usage were
        # three hand-maintained lists with nothing comparing them. They had
        # already drifted: mc_custom_exercises_v1 was documented as synced and
        # was in neither, and mc_session_summary_v1 was synced but not exported.
        # This is the gate that makes that class of drift impossible to reland.
        run: node tools/check-store-coverage.js

      - name: Topmost-bar safe-area check (sticky .topbar pins at top:0, opaque)
        # base.css offset `.topbar` with the SECONDARY sticky bars, but a
        # .topbar is the TOPMOST bar on its page — pinning it at the inset left
        # the status-bar band unpainted, so page content scrolled through it in
        # plain sight, and dashboard.html double-inset because it pads itself
        # too. All seven also faded to transparent INSIDE the bar, so content
        # read through the bottom fifth of the chrome. env() is 0 headlessly,
        # so this is a SOURCE check for the same reason check-journey.js's
        # safe-area pass is — at runtime the broken and fixed forms look alike.
        run: node tools/check-topbar-inset.js

      - name: Market-extraction leak check (content-manifest.json)
        run: python3 tools/build-market.py --check

      - name: Shared-module drift check (Mikes-Cookbook copies vs canonical — audit LS-1)
        # DEPLOY-ONLY ON PURPOSE. This compares against the cookbook's CURRENT
        # main, and the documented landing order for a shared-module change is
        # "merge this repo's PR first, then the cookbook's" — so between those
        # two merges this check fails BY DESIGN. Running it on pull requests
        # would turn every shared-module PR red before the merge that is
        # supposed to happen first, inverting the process it exists to protect.
        if: ${{ inputs.cross-repo-drift }}
        run: |
          mkdir -p /tmp/cookbook-mirror/tools
          base="https://raw.githubusercontent.com/mcross2298/Mikes-Cookbook/main"
          for f in tracker-foodapi.js tracker-calc.js tracker-barcode.js \
                   mc-bridge.js mc-install.js mc-backup-status.js tools/test-mc-bridge.js; do
            curl -fsSL --retry 3 "$base/$f" -o "/tmp/cookbook-mirror/$f"
          done
          python3 tools/sync-shared-modules.py --check --cookbook-dir /tmp/cookbook-mirror

  smoke:
    name: Headless render smoke test
    # Separate job so the ~3-4 min Playwright install runs in parallel with the
    # fast checks above rather than serialising behind them.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Headless render smoke test (blocking)
        # CI-only tooling, installed into a scratch prefix outside the repo —
        # no package.json here, deliberately (see CLAUDE.md).
        run: |
          npm install --no-save --prefix /tmp/pw-ci playwright@latest pixelmatch pngjs
          /tmp/pw-ci/node_modules/.bin/playwright install --with-deps chromium
          python3 -m http.server 8080 &
          SERVER_PID=$!
          for i in $(seq 1 20); do curl -sf http://localhost:8080/index.html >/dev/null && break; sleep 0.5; done
          NODE_PATH=/tmp/pw-ci/node_modules node tools/smoke-test-pages.js http://localhost:8080
          EXIT=$?
          # Complete-workout journey gate. Every other check here inspects the
          # app AT REST -- none of them ever logs a set. Three defects shipped
          # through all of them and were caught only by driving a full session
          # (roadmap M5), including one that is not a bug in any single file:
          # two independently-correct changes that collide only on one engine
          # family. Drives one page per card engine, and asserts the session can
          # be completed, no control is unreachable, nothing overflows, and the
          # controls the session shell owns clear the 44pt touch floor.
          # Budgets in tools/journey-budgets.json; re-baseline deliberately with
          # `node tools/check-journey.js <url> --update`.
          if ! NODE_PATH=/tmp/pw-ci/node_modules node tools/check-journey.js http://localhost:8080; then EXIT=1; fi
          # Light-mode contrast ratchet (audit G-04/G-3.1). Shares this job
          # because it needs the same Playwright install. Per-page budgets in
          # tools/contrast-budgets.json can only shrink; re-baseline with
          # `node tools/check-contrast.js <url> --update` if a change is
          # deliberate.
          if [ "$EXIT" -eq 0 ]; then
            NODE_PATH=/tmp/pw-ci/node_modules node tools/check-contrast.js http://localhost:8080
            EXIT=$?
          fi
          # Runtime performance budget (audit K-3.1/A-15) — the S1 −99.5%
          # runtime win (2983.8 → 15 mutation records/s on mm-p1.html) can
          # never silently regress again the way S5c-0 nearly did (15 → 53.9
          # records/s, caught only by a manual re-measurement). Three probe
          # pages, one per rendering engine shape; budgets in
          # tools/perf-budgets.json, re-baseline with
          # `node tools/measure-session.js <url> --page <p> --update-check
          # tools/perf-budgets.json` if a change is deliberate.
          if [ "$EXIT" -eq 0 ]; then
            for PAGE in mm-p1.html bro-split.html psu-strength.html; do
              NODE_PATH=/tmp/pw-ci/node_modules node tools/measure-session.js http://localhost:8080 \
                --page "$PAGE" --seconds 6 --check tools/perf-budgets.json
              EXIT=$?
              [ "$EXIT" -eq 0 ] || break
            done
          fi
          # Kitchen-sink visual ratchet (audit DG-9) — the contrast ratchet's
          # sibling, for structure/layout rather than per-element color.
          # Baselines in tools/visual-baselines/; re-baseline with
          # `node tools/check-visual-ratchet.js <url> --update` if a change
          # is deliberate.
          if [ "$EXIT" -eq 0 ]; then
            NODE_PATH=/tmp/pw-ci/node_modules node tools/check-visual-ratchet.js http://localhost:8080
            EXIT=$?
          fi
          kill "$SERVER_PID" 2>/dev/null || true
          exit $EXIT
