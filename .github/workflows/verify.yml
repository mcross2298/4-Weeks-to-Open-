name: Verify

# The canonical check list, called by both the PR path (pr.yml) and the deploy
# path (pages.yml) so a pull request runs exactly what the deploy will run.
#
# Before this existed, every gate lived inside pages.yml's deploy job, which
# only triggers on push to main — so all of them ran AFTER merge, and the only
# pull-request signal was market-check.yml's four-step subset. A PR could be
# reviewed and merged fully green while carrying a failure that surfaced by
# breaking the deploy.
#
# Not everything belongs on both paths. `cross-repo-drift` is opt-in for that
# reason (see the step's own comment) — the deploy passes true, PRs don't.

on:
  workflow_call:
    inputs:
      cross-repo-drift:
        description: >-
          Run the Mikes-Cookbook shared-module byte-identity check. Deploy-only
          by design; see the step comment for why it must not gate a PR.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JS syntax check (node --check)
        run: |
          fail=0
          for f in $(git ls-files '*.js'); do
            node --check "$f" || { echo "::error file=$f::JavaScript syntax error"; fail=1; }
          done
          exit $fail

      - name: Resolver / precedence unit tests
        run: node tools/test-naming.js

      - name: Validate program-overrides.json
        run: python3 tools/validate-overrides.py

      - name: Weight-math regression tests (real source, not a duplicated copy)
        run: |
          node tools/test-mc-suggest.js
          node tools/test-mc-maxout.js

      - name: Cross-app bridge regression tests (mc-bridge.js read layer + mc-sync.js merge logic)
        run: |
          node tools/test-mc-bridge.js
          node tools/test-mc-sync-merge.js

      - name: Service-worker strategy test (stale-while-revalidate — audit LS-4)
        run: node tools/test-mc-sw.js

      - name: Service-worker precache freshness (committed sw.js matches the tree)
        # --check, not --version: the deploy regenerates sw.js with a run-scoped
        # cache version, but at review time we want to know the committed file
        # still lists the right URLs.
        run: python3 tools/build-sw.py --check

      - name: Script-manifest drift check (clone pages load identical module lists — audit LS-3)
        run: python3 tools/check-script-manifest.py --check

      - name: Page head-contract check (install meta + theme boot on every page — audit G-02/G-03)
        # Owns the <head> block and the mc-sw-update.js tail tag on all 140
        # deployable pages. Regenerate with: python3 tools/apply-head-contract.py
        run: python3 tools/apply-head-contract.py --check

      - name: Program color-sync check (mc-pm-data.js vs dashboard.html vs mc-theme.js)
        run: node tools/check-program-colors.js

      - name: Multi-week program intensifier-coverage check (mm-p1/p2/p3.html)
        run: node tools/validate-programs.js

      - name: Market-extraction leak check (content-manifest.json)
        run: python3 tools/build-market.py --check

      - name: Shared-module drift check (Mikes-Cookbook copies vs canonical — audit LS-1)
        # DEPLOY-ONLY ON PURPOSE. This compares against the cookbook's CURRENT
        # main, and the documented landing order for a shared-module change is
        # "merge this repo's PR first, then the cookbook's" — so between those
        # two merges this check fails BY DESIGN. Running it on pull requests
        # would turn every shared-module PR red before the merge that is
        # supposed to happen first, inverting the process it exists to protect.
        if: ${{ inputs.cross-repo-drift }}
        run: |
          mkdir -p /tmp/cookbook-mirror/tools
          base="https://raw.githubusercontent.com/mcross2298/Mikes-Cookbook/main"
          for f in tracker-foodapi.js tracker-calc.js tracker-barcode.js \
                   mc-bridge.js mc-install.js mc-backup-status.js tools/test-mc-bridge.js; do
            curl -fsSL --retry 3 "$base/$f" -o "/tmp/cookbook-mirror/$f"
          done
          python3 tools/sync-shared-modules.py --check --cookbook-dir /tmp/cookbook-mirror

  smoke:
    name: Headless render smoke test
    # Separate job so the ~3-4 min Playwright install runs in parallel with the
    # fast checks above rather than serialising behind them.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Headless render smoke test (blocking)
        # CI-only tooling, installed into a scratch prefix outside the repo —
        # no package.json here, deliberately (see CLAUDE.md).
        run: |
          npm install --no-save --prefix /tmp/pw-ci playwright@latest
          /tmp/pw-ci/node_modules/.bin/playwright install --with-deps chromium
          python3 -m http.server 8080 &
          SERVER_PID=$!
          for i in $(seq 1 20); do curl -sf http://localhost:8080/index.html >/dev/null && break; sleep 0.5; done
          NODE_PATH=/tmp/pw-ci/node_modules node tools/smoke-test-pages.js http://localhost:8080
          EXIT=$?
          kill "$SERVER_PID" 2>/dev/null || true
          exit $EXIT
