name: Live QA (nightly)

# Continuous QA, layer 1 (qa-collision-audit.md, "Continuous QA"). Drives the
# DEPLOYED app -- minified JavaScript and a live service worker, which only
# activates on the production origin -- with the same browser gates verify.yml
# runs on the tree. A defect that exists only after deploy is invisible to
# every PR check; this is where it shows.
#
# Read-only on code. A failure opens one `live-qa` issue, or comments on the
# one already open, naming each failing gate and linking this run. The weekly
# Claude QA task reads open `live-qa` issues first. Nothing here carries
# athlete data: the gates run in fresh, signed-out browser contexts.

on:
  schedule:
    - cron: '17 7 * * *'     # 03:17 New York (EDT); 02:17 in winter
  workflow_dispatch:
    inputs:
      base:
        description: 'Site to test (default: the live app)'
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: live-qa
  cancel-in-progress: false

jobs:
  live:
    name: Browser gates against the live site
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE: ${{ github.event.inputs.base || 'https://mcross2298.github.io/4-Weeks-to-Open-' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Playwright (scratch prefix, no package.json -- see CLAUDE.md)
        run: |
          npm install --no-save --prefix /tmp/pw-ci playwright@latest
          /tmp/pw-ci/node_modules/.bin/playwright install --with-deps chromium

      - name: Wait for the site
        run: |
          for i in $(seq 1 20); do
            curl -sf "$BASE/index.html" >/dev/null && exit 0
            sleep 15
          done
          echo "::error::$BASE/index.html did not answer"; exit 1

      - name: Run the gates
        id: gates
        # Every gate runs even after one fails, and each failure is named on
        # its own line, so the issue says WHICH gate failed without anyone
        # opening the log (verify.yml's FAILED: <gate> convention, N1).
        run: |
          FAILED=""
          for g in tools/smoke-test-pages.js tools/check-tap-intent.js tools/check-journey.js \
                   tools/test-mc-session-durability.js GO_LIVE/flagship-audit/scenarios/fa-repro.js; do
            echo "::group::$g"
            if ! NODE_PATH=/tmp/pw-ci/node_modules node "$g" "$BASE"; then
              echo "FAILED: $g"; FAILED="$FAILED $g"
            fi
            echo "::endgroup::"
          done
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          [ -z "$FAILED" ]

      - name: Open or update the live-qa issue
        if: failure() && steps.gates.outputs.failed != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ steps.gates.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create live-qa --color B60205 \
            --description "Nightly live-site QA found a failure" 2>/dev/null || true
          LIST=$(for g in $FAILED; do echo "- \`$g\`"; done)
          BODY=$(printf 'Nightly live QA against %s failed.\n\n%s\n\nRun: %s\n\nThe weekly QA task reads this issue first. Close it once the site passes again.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_' "$BASE" "$LIST" "$RUN_URL")
          OPEN=$(gh issue list --label live-qa --state open --json number --jq '.[0].number')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "$BODY"
          else
            gh issue create --label live-qa --title "Live QA: $(echo $FAILED | wc -w) gate(s) failing on the live site" --body "$BODY"
          fi
