name: Deploy to GitHub Pages

# The verification steps that used to live inline in the deploy job now live in
# verify.yml, shared with the pull-request path (pr.yml), so a PR runs exactly
# what this deploy runs. Only genuinely deploy-specific work is left here:
# generating the service worker with a run-scoped cache version, trimming the
# artifact, and publishing.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      # Deploy-only: this compares against Mikes-Cookbook's current main, and
      # fails by design between a shared-module PR merging here and the matching
      # cookbook PR merging there. Re-run this workflow once the cookbook PR
      # lands. It must not gate pull requests — see verify.yml's step comment.
      cross-repo-drift: true

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate service worker (auto version + precache list)
        run: python3 tools/build-sw.py --version "ci-${{ github.run_number }}"
      - name: Strip design comps + scratch pages from deploy artifact (audit LS-2 W-08)
        # These design mockups live in the repo for reference but must never be
        # guessable URLs on the production origin. Removed from the working tree
        # AFTER verify has run and BEFORE the artifact is packed — git history
        # keeps them; only the deploy is trimmed. (The Rolodex market build
        # already excludes them via content-manifest.json + *.dc.html.)
        run: |
          rm -f ./*.dc.html stndr-card-concepts.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
