name: Deploy to GitHub Pages

# The verification steps that used to live inline in the deploy job now live in
# verify.yml, shared with the pull-request path (pr.yml), so a PR runs exactly
# what this deploy runs. Only genuinely deploy-specific work is left here:
# generating the service worker with a run-scoped cache version, trimming the
# artifact, and publishing.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      # Deploy-only: this compares against Mikes-Cookbook's current main, and
      # fails by design between a shared-module PR merging here and the matching
      # cookbook PR merging there. Re-run this workflow once the cookbook PR
      # lands. It must not gate pull requests — see verify.yml's step comment.
      cross-repo-drift: true

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate service worker (auto version + precache list)
        run: python3 tools/build-sw.py --version "ci-${{ github.run_number }}"
      - name: Strip design comps + scratch pages from deploy artifact (audit LS-2 W-08, R-I3)
        # These design mockups live in the repo for reference but must never be
        # guessable URLs on the production origin. Removed from the working tree
        # AFTER verify has run and BEFORE the artifact is packed — git history
        # keeps them; only the deploy is trimmed.
        #
        # R-I3 (VOC/VOA Kaizen audit): content-manifest.json's own top comment
        # defines 'scratch' as "ships to NEITHER build" — but until now only
        # the Rolodex extraction (build-market.py) honored that. This deploy
        # stripped just two hardcoded names, so every scratch-listed internal
        # doc (roadmaps, audit findings, CLAUDE.md) stayed live on THIS repo's
        # own origin even after being scratch-listed. One disclosure rule,
        # read from the manifest both deploys share, instead of two that
        # quietly disagreed. content-manifest.json itself is dropped too,
        # matching build-market.py's own MANIFEST exclusion — the manifest is
        # build tooling, not a shipped asset.
        run: |
          python3 -c "import json; print(chr(10).join(json.load(open('content-manifest.json'))['scratch']))" \
            | xargs -d '\n' -r rm -f
          rm -f ./*.dc.html content-manifest.json
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
