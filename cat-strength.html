// `week` is optional and defaults to 1, so the Program list rows and the
// not-found picker below (which call showWorkout(id) with no week) are
// unchanged. The day view passes the week its day actually belongs to —
// opening Day 8 must land on Week 2, not Week 1.
function showWorkout(workoutId, week){
  currentWorkoutId = workoutId;
  activeWeek = (week && week > 0) ? week : 1;
  // Save for resume
  const w = PMC_SPLITS[workoutId];
  if(w){
    const split = SPLITS.find(s => s.workouts.some(wk => wk.id === workoutId));
    localStorage.setItem(LAST_WORKOUT_KEY, JSON.stringify({
      workoutId, week: activeWeek, name: w.title, splitName: split ? split.name : w.split
    }));
  }
  document.getElementById('view-dashboard').classList.add('hidden');
  document.getElementById('view-split').classList.remove('active');
  document.getElementById('view-workout').classList.add('active');
  window.scrollTo(0,0);
  renderWorkout();
}

function renderBlocks(blocks, wid){
  return blocks.map((block, bi)=>{
    const rounds = block.rounds || 5;
    const exHtml = block.exercises.map((ex, ei)=>{
      // support both legacy name-strings and {name, reps} objects (S7 shared source)
      const name = (typeof ex === 'string') ? ex : ex.name;
      const reps = (typeof ex === 'string') ? '' : (ex.reps || '');
      const id=`${wid}-b${bi}-e${ei}`, ck=checkState[id]?'checked':'';
      return `<div class="block-ex ${ck}" data-id="${id}" data-type="bex"><div class="block-ex-dot"></div><div class="block-ex-name">${name}</div>${reps?`<span class="block-ex-reps">${reps} reps</span>`:''}</div>`;
    }).join('');
    const roundBtns = Array.from({length:rounds},(_,i)=>{
      const rid=`${wid}-b${bi}-r${i}`, ck=roundState[rid]?'done':'';
      return `<button class="round-btn ${ck}" data-rid="${rid}" onclick="toggleRound(this,'${rid}')">${ck?'✓ ':''} Round ${i+1}</button>`;
    }).join('');
    return `<div class="block-card">
      <div class="block-header"><span class="block-title">${block.title}</span><span class="block-rounds">${rounds} ROUNDS</span></div>
      ${block.part?`<div class="block-giant-badge">⚡ Giant Set · ${block.part}</div>`:''}
      ${block.replace?`<div class="block-note">🔄 Replace week — swap 2 exercises via the Exercise Library</div>`:''}
      ${block.note?`<div class="block-note">${block.note}</div>`:''}
      ${block.warmup?`<div class="block-warmup"><span class="block-warmup-label">WARMUP</span>${block.warmup}</div>`:''}
      ${exHtml}
      <div class="block-rounds-btns">${roundBtns}</div>
    </div>`;
  }).join('');
}

function toggleRound(btn, rid){
  roundState[rid] = !roundState[rid];
  btn.classList.toggle('done', roundState[rid]);
  btn.textContent = roundState[rid] ? `✓ ${btn.textContent.replace('✓ ','')}` : btn.textContent.replace('✓ ','');
  updateProgress();
}

// ── GET EXERCISES FOR WEEK ─────────────────────────────────────────
function getWeekData(workout, week){
  const raw = workout.data || {};
  if(workout.type === 'blocks') return null; // blocks handled separately

  // Normalize: data is either {week:[...exercises]} or {week:{warmup, exercises:[...]}}
  function getExercises(weekData){
    if(!weekData) return [];
    if(Array.isArray(weekData)) return weekData;
    if(weekData.exercises) return weekData.exercises;
    return [];
  }
  function hasWarmup(weekData){ return !!(weekData && weekData.warmup === true); }

  const wd = raw[week] || raw[1];
  return { exercises: getExercises(wd), warmup: hasWarmup(wd) };
}

  const all=document.querySelectorAll('.ex-card,.ss-ex,.block-ex');
  const done=document.querySelectorAll('.ex-card.checked,.ss-ex.checked,.block-ex.checked');
  const pct=all.length?Math.round((done.length/all.length)*100):0;
  const fill=document.getElementById('progFill');
  if(fill)fill.style.width=pct+'%';
}

// ── NOTES ─────────────────────────────────────────────────────────
function initNotes(){
  const NOTES_KEY='pmc_notes_'+currentWorkoutId;
  let notes={};try{notes=JSON.parse(localStorage.getItem(NOTES_KEY)||'{}');}catch(e){}
  document.querySelectorAll('.ex-card[data-id]').forEach(card=>{
    const id=card.dataset.id;if(!id||card.querySelector('.ex-notes-wrap'))return;
    const existing=notes[id]||'';
    const toggle=document.createElement('div');toggle.className='ex-notes-toggle';
    toggle.innerHTML=existing?`✏️ ${existing.substring(0,20)}${existing.length>20?'…':''}`:'✚ Add weight/notes';
    const wrap=document.createElement('div');wrap.className=`ex-notes-wrap${existing?' open':''}`;
    wrap.innerHTML=`<div class="ex-notes-label">Weight / Notes</div><textarea class="ex-notes-input" rows="1" placeholder="e.g. 135 lbs · felt strong">${existing}</textarea>`;
    toggle.addEventListener('click',e=>{e.stopPropagation();wrap.classList.toggle('open');});
    const ta=wrap.querySelector('textarea');
    ta.addEventListener('input',function(){
      notes[id]=this.value.trim();
      if(!notes[id])delete notes[id];
      localStorage.setItem(NOTES_KEY,JSON.stringify(notes));
      toggle.innerHTML=this.value.trim()?`✏️ ${this.value.trim().substring(0,20)}${this.value.trim().length>20?'…':''}`:'✚ Add weight/notes';
    });
    const content=card.querySelector('.ex-content');
    if(content){content.appendChild(toggle);content.appendChild(wrap);}
  });
}

// ══════════════════════════════
//  PROGRAM PROGRESS  (program-flow-roadmap.md F0)
//  The day-by-day module moved to dashboard.html, where it is driven by
//  mc_active_prog and instantiated once rather than once per program.
//  Two things stay here, because this page is the only one that knows them:
//    1. the ?day=&week= deep link the dashboard's "Start Day N" lands on
//    2. which prescribed day a finished session actually was
// ══════════════════════════════
const PD = window.MC_PROGRAM_PROGRESS;

// Read the block shape from mc-pm-data.js rather than restating it, so this
// page and the dashboard cannot disagree about weeks / rest / day order.
const SS_SCHED = ((window.MC_PM_DATA && MC_PM_DATA.program('ss')) || {}).schedule || {};
const SS_DEF = {
  weeks:   SS_SCHED.weeks   || 6,
  perWeek: SS_SCHED.perWeek || 7,
  rest:    (SS_SCHED.rest || [6, 7]).slice(),
  order:   (SS_SCHED.days || []).map(function(d){ return d.id; })
};

// ── the landing tabs (program-flow-roadmap.md F1) ──────────────────────────
// ss is the one-level case: its "splits" ARE its days, so ONE group is passed
// and MC_PROGRAM_TABS renders the day rows with no drill-in above them. A
// two-level program hands over several groups instead; nothing here changes.
//
// dayMeta reads mc-pm-data.js's schedule record — the same source the
// dashboard's day hero reads — so the two surfaces cannot disagree about a
// day's title, icon or duration.
const SS_DAY_META = {};
(SS_SCHED.days || []).forEach(function (d) { SS_DAY_META[d.id] = d; });

// Equipment is derived, not authored: every exercise name in the block, run
// through mc-biomech.js's classifier. Weeks share the same movement pool, so
// week 1 is representative and reading all six would only add duplicates.
function ssExerciseNames(){
  var out = [];
  Object.keys(PMC_SPLITS).forEach(function (id) {
    var wk = (PMC_SPLITS[id].data || {})[1] || [];
    wk.forEach(function (ex) {
      if (ex.type === 'superset') { if (ex.a) out.push(ex.a.name); if (ex.b) out.push(ex.b.name); }
      else if (ex.name) out.push(ex.name);
    });
  });
  return out;
}

const SS_PROG = (window.MC_PM_DATA && MC_PM_DATA.program('ss')) || {};
const ssTabs = window.MC_PROGRAM_TABS && MC_PROGRAM_TABS.mount(document.getElementById('progTabs'), {
  progId: 'ss',
  def: SS_DEF,
  accent: '#e11d48',
  programName: SS_PROG.name || 'Strength & Supersets',
  desc: SS_PROG.desc || '',
  forWho: SS_PROG.forWho || '',
  instructions: window.MC_INSTRUCTIONS,
  guide: { href: 'ss-instructions.html', label: 'Strength & Supersets guide' },
  groups: [{ id: 'cycle', name: 'The 6-Week Cycle', days: SS_DEF.order.slice() }],
  dayMeta: function (id) { return SS_DAY_META[id] || null; },
  exerciseNames: ssExerciseNames(),
  onNavigate: function (action) {
    if (action === 'programs') location.href = 'dashboard.html?screen=programs';
    else if (action === 'logs') location.href = 'workout-logs.html';
    else if (action === 'calendar') location.href = 'dashboard.html?tab=calendar';
  },
  onOpen: function (workoutId, week) { showWorkout(workoutId, week); },
  onLog: function (workoutId, logId) { location.href = 'workout-detail.html?id=' + encodeURIComponent(logId); }
});

// ── deep link ──────────────────
// dashboard.html links cat-strength.html?day=<workoutId>&week=<n>. Landing on
// the day directly is the entire point of that CTA, so an unknown or missing
// param falls through to the normal picker rather than erroring.
(function(){
  try{
    var q = new URLSearchParams(location.search);
    var d = q.get('day');
    if(!d || !PMC_SPLITS[d]) return;
    var w = parseInt(q.get('week'), 10);
    showWorkout(d, (w > 0 && w <= SS_DEF.weeks) ? w : 1);
  }catch(e){}
})();

// ── completion ─────────────────
// mc-finish.js emits this from _FW.confirm(), its one completion point
// (roadmap D1). currentWorkoutId/activeWeek still hold the day that was being
// trained, so the completion is attributed to the right prescribed day rather
// than to whatever the cursor happens to read. Until F4 gives day pages their
// own identity contract, this listener is what keeps the dashboard advancing.
document.addEventListener('mc:workout-finished', function(ev){
  if(!currentWorkoutId || !PD) return;
  var entry = (ev.detail && ev.detail.entry) || {};
  var rec = PD.get('ss', SS_DEF);
  var rank = PD.orderForWeek(rec, activeWeek).indexOf(currentWorkoutId);
  if(rank < 0) return;
  // Rank among the week's NON-rest positions -> the continuous day number.
  var pos = 0, seen = -1;
  for(var p = 1; p <= rec.perWeek; p++){
    if(rec.rest.indexOf(p) >= 0) continue;
    seen++;
    if(seen === rank){ pos = p; break; }
  }
  if(!pos) return;
  var day = (activeWeek - 1) * rec.perWeek + pos;
  PD.complete('ss', day, { logId: entry.id, workoutId: currentWorkoutId }, SS_DEF);
  // The list is behind the workout view right now, but the athlete backs out
  // to it — re-read so the day it just banked is ticked when they get there.
  if (ssTabs) ssTabs.refresh({ week: activeWeek });
});

// ══════════════════════════════════════════════════════════════
//  FINISH WORKOUT BAR + SAVE HOOK (consumed by mc-summary.js)
//  mc-summary.js builds the sticky summary/stat bar, patches
//  _FW.open → recap sheet, and handles save + navigation on exit.
// ══════════════════════════════════════════════════════════════
// The Finish bar and the _FW controller are both owned by mc-finish.js, which
// loads below. This page used to build its own #fwBar here AND define a _FW
