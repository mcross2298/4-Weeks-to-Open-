<script>
buildTimerFloat();


const WORKOUTS = [
  {
    id:"w1", label:"W1",
    title:"Legs — Tempo Pyramid",
    note:"Slow eccentric on every rep — 4:0:1:0 is mandatory. Build the mind-muscle connection before adding weight.",
    quads:[
      {name:"Leg Extension (feet neutral — activation)", sets:"4×15", tempo:"1:2:1:0", note:"Primer set — get blood into the quad before loading"},
      {name:"Close Stance Barbell Back Squat", sets:"12, 10, 8, 6", tempo:"4:0:1:0", note:"Feet inside shoulder width · toes forward — pyramid up each set"},
      {name:"Hack Squat (low foot placement · close stance)", sets:"4×8", tempo:"4:0:1:0", note:"Low stance maximizes quad stretch at the bottom"},
      {name:"Dumbbell Walking Lunge", sets:"3×12 per leg", tempo:"1:2:1:0", note:"Torso upright — drive through front heel to load the quad"},
      {name:"Leg Extension (feet neutral — finisher)", sets:"3×15", tempo:"1:0:1:4", note:"4-second squeeze at full extension — no momentum"},
    ],
    hamstrings:[
      {name:"Romanian Deadlift", sets:"12, 10, 8, 6", tempo:"4:0:1:0", note:"Full stretch at the bottom — control the eccentric every rep"},
      {name:"Lying Leg Curl", sets:"4×10", tempo:"4:0:1:2", note:"2-second squeeze at peak contraction"},
      {name:"Seated Leg Curl", sets:"3×12", tempo:"4:2:1:0", note:"2-second pause at stretch — eliminates momentum"},
    ],
    calves:[
      {name:"Standing Calf Raise (feet neutral)", sets:"15, 12, 10, 10", tempo:"1:2:1:0", note:"Deep stretch at the bottom — full plantarflexion at the top"},
      {name:"Seated Calf Raise (feet neutral)", sets:"4×15", tempo:"1:2:1:2", note:"2-second squeeze at top — isolates the soleus"},
    ]
  },
  {
    id:"w2", label:"W2",
    title:"Legs — Angle & Grip Focus",
    note:"Foot position changes everything on quads. Rotate intentionally — each angle hits a different head.",
    quads:[
      {name:"Leg Extension (feet turned out — VMO / teardrop)", sets:"4×12", tempo:"4:2:1:2", note:"Toes outward targets inner quad sweep and teardrop"},
      {name:"Leg Extension (feet turned in — outer sweep)", sets:"4×10", tempo:"4:2:1:2", note:"Toes inward shifts emphasis to vastus lateralis"},
      {name:"Close Stance Goblet Squat", sets:"4×10", tempo:"4:2:1:0", note:"Deep range — elbows inside knees at bottom, full quad load"},
      {name:"Hack Squat (low foot placement · close stance)", sets:"4×8", tempo:"4:2:1:0"},
      {name:"Dumbbell Walking Lunge", sets:"3×10 per leg", tempo:"2:2:1:0", note:"Slow descent — pause 2 seconds at the bottom of each lunge"},
    ],
    hamstrings:[
      {name:"Romanian Deadlift", sets:"4×10", tempo:"4:2:1:0", note:"2-second pause at full stretch — feel every fiber"},
      {name:"Lying Leg Curl (toes pointed)", sets:"4×10", tempo:"4:0:1:2", note:"Toes pointed targets the short head — squeeze hard at peak"},
      {name:"Seated Leg Curl (toes neutral)", sets:"3×12", tempo:"4:2:1:0"},
    ],
    calves:[
      {name:"Seated Calf Raise (feet neutral)", sets:"4×12", tempo:"4:2:1:2", note:"Full TUT — matches the slow tempo theme"},
      {name:"Standing Calf Raise (toes slightly turned out)", sets:"4×10", tempo:"4:2:1:0", note:"Slight outward toe targets inner calf head"},
    ]
  },
  {
    id:"w3", label:"W3",
    title:"Legs — Drop Set Gauntlet",
    note:"Drop sets on the final set of every compound. Strip weight immediately — no rest between drops.",
    quads:[
      {name:"Leg Extension (feet neutral)", sets:"12, 10, 8 drop 12", tempo:"1:2:1:0", note:"Drop set on final set — drop 25%, no rest, pump out 12 more"},
      {name:"Close Stance Barbell Back Squat", sets:"4×8", tempo:"1:2:1:0"},
      {name:"Hack Squat (low foot placement · close stance)", sets:"12, 10, 8 drop 8", tempo:"4:0:1:0", note:"Drop set — stay on machine, drop weight, pump 8 more"},
      {name:"Dumbbell Walking Lunge", sets:"4×12 per leg", tempo:"1:2:1:0"},
      {name:"Leg Extension (feet neutral — triple drop finisher)", sets:"3×10 drop 15 drop 20", tempo:"1:0:1:2", note:"Two drops — no rest between. Pure metabolic overload."},
    ],
    hamstrings:[
      {name:"Romanian Deadlift", sets:"12, 10, 8 drop 12", tempo:"4:0:1:0", note:"Drop set on final set — control the extra reps"},
      {name:"Lying Leg Curl", sets:"12, 10, 8 drop 12", tempo:"4:0:1:2"},
      {name:"Seated Leg Curl", sets:"3×10 drop 15", tempo:"3:0:1:2", note:"Drop set finisher — lighter weight, squeeze every rep"},
    ],
    calves:[
      {name:"Standing Calf Raise (feet neutral)", sets:"12, 10, 8 drop 12", tempo:"1:2:1:0", note:"Drop set on final set — matches the gauntlet theme"},
      {name:"Seated Calf Raise (feet neutral)", sets:"3×15", tempo:"1:2:1:2", note:"High-rep burnout — 2-second squeeze at top each rep"},
    ]
  },
  {
    id:"w4", label:"W4",
    title:"Legs — Superset Circuit",
    note:"Back-to-back pairs with no rest between exercises. Rest 90–120 seconds between each superset.",
    quads:[
      {name:"Leg Extension / Close Stance Goblet Squat (superset)", sets:"4×12 / 10", tempo:"1:2:1:2 / 4:2:1:0", note:"Extension immediately into goblet squat — no rest between"},
      {name:"Hack Squat / Dumbbell Walking Lunge (superset)", sets:"4×8 / 12 per leg", tempo:"4:0:1:0 / 1:2:1:0", note:"Straight off the machine into lunges — keep moving"},
      {name:"Close Stance Barbell Back Squat", sets:"4×8", tempo:"4:0:1:0", note:"Standalone — go heavy here, full recovery between sets"},
    ],
    hamstrings:[
      {name:"Romanian Deadlift / Lying Leg Curl (superset)", sets:"4×10 / 12", tempo:"4:0:1:0 / 4:0:1:2", note:"RDL straight into leg curl — posterior chain superset"},
      {name:"Seated Leg Curl / Nordic Curl or Back Extension (superset)", sets:"3×12 / 12", tempo:"4:0:1:2 / 2:0:1:0"},
    ],
    calves:[
      {name:"Standing Calf Raise / Seated Calf Raise (superset)", sets:"3×15 / 15", tempo:"1:2:1:2 / 1:2:1:2", note:"Standing into seated — hits both gastroc and soleus"},
    ]
  },
  {
    id:"w5", label:"W5",
    title:"Legs — Strength & Peak Contraction",
    note:"Heavy compound loading with peak squeeze work. Build density. No shortcuts on the eccentric.",
    quads:[
      {name:"Leg Extension (feet neutral — primer)", sets:"4×15", tempo:"1:0:1:2", note:"High-rep primer — get blood in before the heavy work"},
      {name:"Close Stance Barbell Back Squat", sets:"5×5", tempo:"4:4:1:0", note:"4-second eccentric, 4-second stretch hold — heavy working weight"},
      {name:"Hack Squat (low foot placement · close stance)", sets:"4×6", tempo:"4:3:1:0", note:"Heavy — slow eccentric into 3-second hold, drive out of the hole"},
      {name:"Dumbbell Walking Lunge", sets:"4×10 per leg", tempo:"1:2:1:0"},
      {name:"Leg Extension (feet neutral — squeeze finisher)", sets:"3×10", tempo:"1:0:1:4", note:"4-second hold at top each rep — complete burnout"},
    ],
    hamstrings:[
      {name:"Romanian Deadlift (heavy)", sets:"5×5", tempo:"4:3:1:0", note:"3-second pause at the stretch — heavy working weight"},
      {name:"Lying Leg Curl", sets:"4×8", tempo:"4:0:1:4", note:"4-second squeeze at peak contraction each rep"},
      {name:"Seated Leg Curl", sets:"3×10", tempo:"4:2:1:0", note:"2-second pause at stretch — eliminate all momentum"},
    ],
    calves:[
      {name:"Standing Calf Raise (feet neutral)", sets:"5×5", tempo:"4:4:1:0", note:"Heavy — matches the strength tempo of the squats"},
      {name:"Seated Calf Raise (feet neutral)", sets:"4×10", tempo:"1:2:1:2", note:"Soleus work — 2-second squeeze at top every rep"},
    ]
  },
  {
    id:"w6", label:"W6",
    title:"Legs — High Rep Pump Finisher",
    note:"Lighter weight, maximum volume. Constant tension — no locking out, no full rest at the top or bottom.",
    quads:[
      {name:"Leg Extension (feet neutral)", sets:"4×20", tempo:"2:0:1:0", note:"Constant tension — don't fully lock out at top"},
      {name:"Close Stance Goblet Squat (deep range)", sets:"4×15", tempo:"1:2:1:0", note:"Moderate weight — full depth, control the stretch"},
      {name:"Hack Squat (low foot placement · close stance)", sets:"3×15", tempo:"1:2:1:0", note:"Moderate weight — full quad contraction at top"},
      {name:"Dumbbell Walking Lunge", sets:"4×15 per leg", tempo:"1:2:1:0", note:"Continuous — no stopping between steps"},
      {name:"Leg Extension (feet neutral — pump finisher)", sets:"3×20", tempo:"1:0:1:2", note:"Squeeze at top, no full lockout — constant muscle tension"},
    ],
    hamstrings:[
      {name:"Romanian Deadlift", sets:"4×15", tempo:"2:0:1:0", note:"Lighter weight — feel the stretch, control the return"},
      {name:"Lying Leg Curl", sets:"4×20", tempo:"2:0:1:2", note:"Constant tension — squeeze every rep"},
      {name:"Seated Leg Curl", sets:"3×20", tempo:"2:0:1:2", note:"High-rep burnout — light weight, pure pump"},
    ],
    calves:[
      {name:"Standing Calf Raise (feet neutral)", sets:"4×20", tempo:"1:2:1:0", note:"High rep — matches the volume pump theme"},
      {name:"Seated Calf Raise (feet neutral)", sets:"3×15 drop 20", tempo:"1:2:1:2", note:"Drop set finisher — drop weight, no rest, pump out 20 more"},
    ]
  },
];

let activeIdx = 0;
const checkState = {};

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function renderEx(ex, prefix, idx) {
  const id = `${activeIdx}-${prefix}-${idx}`;
  const checked = checkState[id] ? "checked" : "";
  const rest = ex.rest || "60 sec";
  const badgeHtml = ex.tempo ? `<div class="a-badges"><span class="ex-tempo">${esc(ex.tempo)}</span></div>` : "";
  const noteHtml = ex.note ? `<div class="a-notes">📝 ${esc(ex.note)}</div>` : "";
  return `<div class="ex-card a-card a-hdr-card ${checked}" data-id="${id}" data-type="single">
    <div class="ex-body">
      <div class="a-hdr"><div class="a-idx">${idx+1}</div><div class="a-head"><div class="ex-name a-name">${esc(ex.name)}</div></div>${noteHtml ? `<button type="button" class="a-info" aria-expanded="false" aria-label="Show coaching note">ⓘ</button>` : ""}<div class="a-hdr-meta">${badgeHtml}<div class="a-reps">${aReps(ex.sets)}</div></div></div>
      <div class="a-strip"><div class="a-cell"><span class="k">Sets</span><span class="v"><span data-field="sets">${esc(ex.sets)}</span></span></div><div class="a-cell"><span class="k">Rest</span><span class="v">${esc(rest)}</span></div></div>
      <div class="a-timerbar">${makeRestTimer(rest, ex.name)}</div>
      ${noteHtml}
    </div>
  </div>`;
}

function render() {
  const w = WORKOUTS[activeIdx];
  const tabsHtml = WORKOUTS.map((wo,i) =>
    `<button class="tab ${i===activeIdx?'active':''}" data-i="${i}">${esc(wo.label)}</button>`
  ).join("");
  const noteHtml = w.note ? `<div class="workout-note">${esc(w.note)}</div>` : "";
  const quadsHtml = w.quads.map((e,i) => renderEx(e,"q",i)).join("");
  const hamsHtml = w.hamstrings.map((e,i) => renderEx(e,"h",i)).join("");
  const calvesHtml = w.calves.map((e,i) => renderEx(e,"c",i)).join("");

  document.getElementById("app").innerHTML = `
    <div class="header">
      <a href="cat-pump-new4.html" class="back-link">← Back</a>
      <div class="header-inner">
        <div class="eyebrow">⏱️ Split #4 · Time Under Tension</div>
        <div class="title">Legs — Quads /<br>Hamstrings / Calves</div>
        <div><span class="schedule">6 Workout Variations</span></div>
      </div>
    </div>
    <div class="tabs-bar"><div class="tabs">${tabsHtml}</div></div>
    <div class="content">
      <div class="workout-title">${esc(w.title)}</div>
      ${noteHtml}
      <div class="tap-hint">Tap any exercise to check off</div>
      <div class="section-label" style="background:rgba(167,139,250,0.15);color:#a78bfa;">🦵 QUADS</div>
      ${quadsHtml}
      <div class="section-label" style="background:rgba(167,139,250,0.1);color:#c4b5fd;">🔙 HAMSTRINGS</div>
      ${hamsHtml}
      <div class="section-label" style="background:rgba(167,139,250,0.08);color:#ddd6fe;">⬆️ CALVES</div>
      ${calvesHtml}
    </div>`;

  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
    activeIdx = parseInt(b.dataset.i); render(); if(typeof initNotes==="function") setTimeout(initNotes,300);
  }));
  document.querySelectorAll(".ex-card").forEach(c => c.addEventListener("click", () => {
    const id = c.dataset.id; checkState[id] = !checkState[id]; c.classList.toggle("checked");
  }));
}

render();
if(typeof updateProgress!=="undefined")updateProgress();


</script>

<script src="mc-replace.js"></script>
<script>
(function() {
  let pressTimer;
  document.addEventListener('touchstart', function(e) {
    const card = e.target.closest('.ex-card, .ex-item, .lift-card');
    if (!card) return;
    pressTimer = setTimeout(function() {
      const nameEl = card.querySelector('.ex-name, .lift-name');
      if (!nameEl) return;
      const origName = nameEl.dataset.orig || nameEl.textContent.trim();
      nameEl.dataset.orig = origName;
      const url = 'exercise-library.html?replace=' + encodeURIComponent(origName);
      if (confirm('Replace "' + origName.substring(0,40) + '"?\nTap OK to open Exercise Library.')) { window.location.href = url; }
    }, 600);
  }, {passive: true});
  document.addEventListener('touchend', function() { clearTimeout(pressTimer); }, {passive: true});
  document.addEventListener('touchmove', function() { clearTimeout(pressTimer); }, {passive: true});
})();
</script>
