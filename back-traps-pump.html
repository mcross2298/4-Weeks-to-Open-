<script>// ── TIMER ENGINE ──
buildTimerFloat();



const WORKOUTS = [

    back:[
      {name:"Lat Pull Down (wide grip, behind neck)", sets:"30, 30, 25, 25, 20, 20"},

      {name:"Straight Arm Lat Pull Down", sets:"4×20"},
      {name:"Seated Cable Row (wide grip)", sets:"30, 30, 25, 25, 20, 20"},
      {name:"Slight Incline Bench Support Double Arm DB Row / Machine Low Row", sets:"4×8/4", tempo:"4:0:1:0 / 1:10:1:0"},
      {name:"Bent Over Barbell Row", sets:"4×20"},
    ],
    traps:[
      {name:"Machine Shrug", sets:"30, 30, 20, 20"},
      {name:"Standing Dumbbell Shrug", sets:"4×15", tempo:"1:0:1:2"},
    ]
  },
  {
    id:"w1", label:"Pyramid",
    title:"Back/Traps — Descending Pyramid",
    back:[
      {name:"Straight Arm Lat Pulldowns", sets:"50, 40, 30, 20, 10"},
      {name:"Machine High Row / V Grip Lat Pulldowns", sets:"4×8/30", tempo:"4:0:1:0 / no tempo"},
      {name:"Lat Pulldowns (wide / shoulder / reverse grip)", sets:"3×10/15/20"},
      {name:"Slight Incline DB Row", sets:"50, 40, 30, 20, 10"},
      {name:"Machine Low Row / Bent Over Barbell Row", sets:"4×8/30", tempo:"4:0:1:0 / no tempo"},

    ],

      {name:"Smith Machine Shrug (wide) / Barbell Shrug / Seated DB Shrug", sets:"3×10/15/20"},
    ]
  },
  {
    id:"w2", label:"Strength",
    title:"Back/Traps — Strength Focus",
    back:[
      {name:"Straight Arm Lat Pulldowns", sets:"4×10", tempo:"4:0:1:0"},
      {name:"Wide Grip Lat Pulldowns / Behind Neck Pulldowns", sets:"4×8/12", tempo:"4:0:1:0 / 1:5:1:0"},
      {name:"Seated Cable Row", sets:"4×10", tempo:"4:0:1:0"},
      {name:"Barbell Row / Machine Low Row", sets:"4×8/12", tempo:"4:0:1:0 / 1:5:1:0"},
      {name:"Pull-ups / Inverted Row", sets:"3×failure"},
    ],
    traps:[
      {name:"Barbell Snatch Shrug", sets:"6×20"},
      {name:"Smith Machine Shrug", sets:"4×10", tempo:"1:0:1:5"},
    ]
  },
  {
    id:"w3", label:"Drop Sets",
    title:"Back/Traps — Drop Set Heavy",
    back:[
      {name:"Wide Grip Behind Neck Lat Pulls", sets:"15, 12, 10, 10 drop 12/15"},
      {name:"Machine High Row / DB Pull Over", sets:"4×6/6"},
      {name:"Straight Arm Lat Pulldowns", sets:"15, 12, 10, 10"},
      {name:"Machine Mid Row", sets:"15, 12, 10, 10 drop 12/15"},
      {name:"Barbell Pendlay Rows", sets:"6×6"},
      {name:"Machine Low Row", sets:"12, 10, 8, 8"},
    ],
    traps:[
      {name:"DB Shrug", sets:"15, 12, 10, 10 drop 12/15"},
      {name:"Behind Back Barbell Shrug", sets:"6×6", tempo:"1:0:1:2"},
    ]
  },
  {
    id:"w4", label:"Angles",
    title:"Back/Traps — Lat Angle Progression",
    back:[
      {name:"Lat Pulldowns (wide)", sets:"3×12", tempo:"4:0:1:0"},
      {name:"Lat Pulldowns (close V grip)", sets:"3×10", tempo:"4:0:1:0"},
      {name:"Lat Pulldowns (reverse grip)", sets:"3×8", tempo:"4:0:1:0"},
      {name:"Straight Arm Lat Pulldowns / Barbell Pullover", sets:"3×8/12"},
      {name:"Incline DB Row (high incline)", sets:"3×12", tempo:"4:0:1:0"},
      {name:"Incline DB Row (medium)", sets:"3×10", tempo:"4:0:1:0"},
      {name:"Incline DB Row (slight)", sets:"3×8", tempo:"4:0:1:0"},
      {name:"DB Seal Row", sets:"3×10", tempo:"4:0:1:0"},
      {name:"Machine Low Row / Seated Cable Row / Bent Over Barbell Row", sets:"3×8/10/12"},
    ],
    traps:[
      {name:"Machine Shrug / Barbell Shrug (outside shoulder)", sets:"4×8/12"},
    ]
  },
  {
    id:"w5", label:"Deadlift",
    title:"Back/Traps — Deadlift Strength",
    back:[
      {name:"Deadlifts", sets:"4×4"},
      {name:"Lat Pulldowns (wide D grip)", sets:"4×4"},
      {name:"Lat Pulldowns (V grip)", sets:"4×6"},
      {name:"Lat Pulldowns (behind neck)", sets:"4×8"},
      {name:"Incline DB Rows", sets:"4×6"},
      {name:"Machine Low Row", sets:"4×8"},
      {name:"Double Handle Kneeling Straight Arm Lat Pulldowns", sets:"—"},
    ],
    traps:[

      {name:"Snatch Grip Shrugs", sets:"4×8"},

  },
  {
    id:"w6", label:"Reverse Pyramid",
    title:"Back/Traps — Reverse Pyramid",
    back:[
      {name:"Wide Grip Lat Pulldowns", sets:"12, 10, 8"},
      {name:"V Grip Lat Pulldowns", sets:"10, 8, 6, 6 drop 8, 10, 12"},
      {name:"Kneeling Straight Arm Lat Pulldowns", sets:"4×12"},
      {name:"Bent Over Smith Machine Rows", sets:"12, 10, 8, 8"},
      {name:"Machine Low Row", sets:"10, 8, 6, 6 drop 8, 10, 12"},
      {name:"Slight Incline DB Rows", sets:"10, 8, 6, 6"},
    ],
    traps:[
      {name:"DB Shrug", sets:"12, 10, 8, 8"},
      {name:"Cable Shrug (snatch grip)", sets:"12, 10, 8, 8 drop 10, 12, 15"},
      {name:"Pull-ups", sets:"3×failure"},
    ]
  },
];

let activeIdx = 0;
const checkState = {};




function render() {
  const w = WORKOUTS[activeIdx];
  const tabsHtml = WORKOUTS.map((wo, i) =>
    `<button class="tab ${i===activeIdx?'active':''}" data-i="${i}">${escapeHtml(wo.label)}</button>`
  ).join("");
  const backHtml = w.back.map((e,i) => renderExercise(e,i,"b")).join("");
  const trapsHtml = w.traps.map((e,i) => renderExercise(e,i,"t","traps")).join("");

  document.getElementById("app").innerHTML = `
    <div class="header">
      <a href="cat-pump-new4.html" class="back-link">← Back</a>
      <div class="header-inner">
        <div class="eyebrow">🔙 Back · Pump</div>
        <div class="title">Back & Traps</div>
        <div><span class="schedule">7 Workout Variations</span></div>
      </div>
    </div>
    <div class="tabs-bar"><div class="tabs">${tabsHtml}</div></div>
    <div class="content">
      <div class="workout-title">${escapeHtml(w.title)}</div>
      <div class="tap-hint">Tap any exercise to check off</div>
      <div class="section-label">Back</div>
      ${backHtml}
      <div class="section-label traps">Traps</div>
      ${trapsHtml}
    </div>`;

  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
    activeIdx = parseInt(b.dataset.i); render();
  }));
  document.querySelectorAll(".ex-card").forEach(c => c.addEventListener("click", () => {
    const id = c.dataset.id;
    checkState[id] = !checkState[id];
    c.classList.toggle("checked");
  }));
}

render();
if(typeof updateProgress!=="undefined")updateProgress();




</script>
