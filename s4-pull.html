<script>// ── TIMER ENGINE ──
buildTimerFloat();



const WORKOUTS = [
  {
    id:"w1", label:"W1",
    title:"Pull — Tempo Pyramid",
    note:"Slow eccentric on every rep. The 4:0:1:0 tempo is non-negotiable — control builds the mind-muscle connection.",
    lats:[
      {name:"Pull-Ups (AMRAP warm-up)", sets:"3 sets to failure", note:"Full hang — dead stop at bottom, chin over bar at top"},
      {name:"Lat Pulldown (wide grip)", sets:"12, 10, 8, 6", tempo:"4:0:1:0"},
      {name:"Seated Cable Row (neutral grip)", sets:"12, 10, 8, 6", tempo:"4:0:1:2", note:"Squeeze shoulder blades at full contraction — 2-second hold"},
      {name:"Single Arm DB Row", sets:"4×10 per side", tempo:"4:0:1:0", note:"Full stretch at bottom — no momentum"},
      {name:"Straight Arm Cable Pulldown", sets:"3×15", tempo:"4:0:1:2"},
    ],
    traps:[
      {name:"Barbell Shrugs", sets:"12, 10, 8, 6", tempo:"1:2:1:2", note:"2-second hold at the top — don't roll the shoulders"},
      {name:"DB Shrugs", sets:"3×15", tempo:"1:0:1:2"},
    ],
    biceps:[
      {name:"Barbell Curl (shoulder width)", sets:"12, 10, 8, 6", tempo:"4:0:1:0"},
      {name:"Incline DB Curl", sets:"3×10", tempo:"4:0:1:2", note:"Full stretch at bottom — no swinging"},
      {name:"Hammer Curl", sets:"3×12", tempo:"2:0:1:0"},
    ]
  },
  {
    id:"w2", label:"W2",
    title:"Pull — Angle Focus",
    note:"Different grips and angles hit different portions of the lat. Rotate intentionally each set.",
    lats:[
      {name:"Pull-Ups (wide grip)", sets:"3 sets to failure", note:"Wide grip stretches the lats fully — full dead hang at bottom"},
      {name:"Lat Pulldown (wide grip → neutral grip → underhand)", sets:"4×8 each grip", tempo:"4:0:1:0", note:"One full set per grip — do not skip any"},
      {name:"Chest-Supported Row (pronated)", sets:"4×10", tempo:"4:0:1:2"},
      {name:"Cable Row (low pulley · wide bar)", sets:"12, 10, 8, 8", tempo:"4:0:1:2"},
      {name:"Straight Arm Pulldown (rope)", sets:"3×12", tempo:"4:0:1:2"},
    ],
    traps:[
      {name:"Face Pulls (rope)", sets:"4×15", tempo:"1:2:1:2", note:"Pull to forehead — external rotate at end of each rep"},
      {name:"Rear Delt DB Fly (incline bench support)", sets:"3×15", tempo:"1:0:1:2"},
    ],
    biceps:[
      {name:"EZ Bar Curl", sets:"12, 10, 8, 6", tempo:"4:0:1:0"},
      {name:"Cable Curl (W-bar · inside shoulder width)", sets:"4×12", tempo:"4:0:1:2"},
      {name:"Reverse Curl (barbell)", sets:"3×15", tempo:"2:0:1:0", note:"Builds brachialis and forearm thickness"},
    ]
  },
  {
    id:"w3", label:"W3",
    title:"Pull — Drop Set Gauntlet",
    note:"Drop sets on compound movements. No resting between drops — the goal is metabolic overload.",
    lats:[
      {name:"Lat Pulldown (wide grip)", sets:"12, 10, 8 drop 12", tempo:"4:0:1:0", note:"Drop set on final set — strip 25–30%, pump out 12 more"},
      {name:"Seated Cable Row (neutral grip)", sets:"12, 10, 8 drop 12", tempo:"4:0:1:2"},
      {name:"Single Arm Cable Row (low pulley)", sets:"3×10 drop 15 per side", tempo:"3:0:1:0"},
      {name:"Straight Arm Pulldown (rope)", sets:"3×10 drop 15", tempo:"4:0:1:2"},
    ],
    traps:[
      {name:"Barbell Shrugs", sets:"12, 10, 8 drop 12", tempo:"1:2:1:2"},
      {name:"Cable Face Pull", sets:"3×15", tempo:"1:0:1:2"},
    ],
    biceps:[
      {name:"Barbell Curl", sets:"12, 10, 8 drop 12", tempo:"4:0:1:0"},
      {name:"Machine Preacher Curl", sets:"10, 8, 6 drop 10", tempo:"4:0:1:2"},
      {name:"Concentration Curl", sets:"3×12 per arm", tempo:"2:0:1:2", note:"Full peak squeeze at top — slow return"},
    ]
  },
  {
    id:"w4", label:"W4",
    title:"Pull — Superset Circuit",
    note:"Back-to-back pairs with no rest between exercises. Rest 90 seconds between each superset pair.",
    lats:[
      {name:"Lat Pulldown / Straight Arm Pulldown (superset)", sets:"4×10 / 12", tempo:"4:0:1:0 / 4:0:1:2", note:"Complete lat pulldown then immediately go to straight arm — no rest"},
      {name:"Seated Cable Row / Single Arm DB Row (superset)", sets:"4×10 / 12 per side", tempo:"4:0:1:2 / 3:0:1:0"},
      {name:"Pull-Up / Chest-Supported Row (superset)", sets:"3×failure / 12", note:"Max effort pull-ups then straight into chest-supported rows"},
    ],
    traps:[
      {name:"Face Pull / DB Shrug (superset)", sets:"3×15 / 12", tempo:"1:2:1:2 / 1:0:1:2"},
    ],
    biceps:[
      {name:"Barbell Curl / Incline DB Curl (superset)", sets:"4×10 / 10", tempo:"4:0:1:0 / 4:0:1:2"},
      {name:"Hammer Curl / Reverse Curl (superset)", sets:"3×12 / 12", tempo:"2:0:1:0 / 2:0:1:0"},
    ]
  },
  {
    id:"w5", label:"W5",
    title:"Pull — Strength & Peak Contraction",
    note:"Heavy compound loading paired with peak squeeze work. Build thickness and density.",
    lats:[
      {name:"Pull-Ups (weighted if possible)", sets:"4×6", tempo:"4:0:1:2", note:"Add weight via belt or dumbbell between knees"},
      {name:"Pendlay Row", sets:"5×5", note:"Explosive pull from the floor — bar touches chest, full reset each rep"},
      {name:"Lat Pulldown (neutral grip)", sets:"4×8", tempo:"4:0:1:2"},
      {name:"Straight Arm Cable Pulldown", sets:"3×15", tempo:"4:0:1:4", note:"4-second squeeze at bottom of every rep"},
    ],
    traps:[
      {name:"Barbell Shrugs (heavy)", sets:"5×5", tempo:"1:3:1:0", note:"3-second hold at peak — heavy working weight"},
      {name:"Cable Face Pull", sets:"3×20", tempo:"1:0:1:2"},
    ],
    biceps:[
      {name:"Barbell Curl (heavy)", sets:"5×5", tempo:"4:0:1:0"},
      {name:"Machine Preacher Curl", sets:"4×8", tempo:"4:0:1:4", note:"4-second squeeze at peak each rep"},
      {name:"D-Grip Hammer Cable Curl", sets:"3×15", tempo:"2:0:1:2"},
    ]
  },
  {
    id:"w6", label:"W6",
    title:"Pull — High Rep Pump Finisher",
    note:"Lighter weight, maximum volume. Constant tension — no locking out, no resting at the bottom.",
    lats:[
      {name:"Lat Pulldown (wide grip)", sets:"4×20", tempo:"2:0:1:0", note:"Constant tension — don't fully lock out at top"},
      {name:"Seated Cable Row (neutral grip)", sets:"4×20", tempo:"2:0:1:2"},
      {name:"Single Arm Cable Row", sets:"3×20 per side", tempo:"2:0:1:0"},
      {name:"Straight Arm Pulldown", sets:"3×20", tempo:"2:0:1:2"},
      {name:"Pull-Over (cable or DB)", sets:"3×20", tempo:"3:0:1:2", note:"Full stretch overhead — squeeze lat at bottom"},
    ],
    traps:[
      {name:"DB Shrugs", sets:"4×20", tempo:"1:0:1:2"},
      {name:"Face Pull (rope)", sets:"3×20", tempo:"1:0:1:2"},
    ],
    biceps:[
      {name:"Cable Curl (EZ bar)", sets:"4×20", tempo:"2:0:1:2"},
      {name:"Alternating DB Curl", sets:"3×15 per arm", tempo:"2:0:1:2"},
      {name:"Concentration Curl", sets:"3×20", tempo:"1:0:1:2", note:"Constant tension — light weight, pure squeeze"},
    ]
  },
];

let activeIdx = 0;
const checkState = {};

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function renderEx(ex, prefix, idx) {
  const id = `${activeIdx}-${prefix}-${idx}`;
  const checked = checkState[id] ? "checked" : "";
  const rest = ex.rest || "60 sec";
  const badgeHtml = ex.tempo ? `<div class="a-badges"><span class="ex-tempo">${esc(ex.tempo)}</span></div>` : "";
  const noteHtml = ex.note ? `<div class="a-notes">📝 ${esc(ex.note)}</div>` : "";
  return `<div class="ex-card a-card a-hdr-card ${checked}" data-id="${id}" data-type="single">
    <div class="ex-body">
      <div class="a-hdr"><div class="a-idx">${idx+1}</div><div class="a-head"><div class="ex-name a-name">${esc(ex.name)}</div></div>${noteHtml ? `<button type="button" class="a-info" aria-expanded="false" aria-label="Show coaching note">ⓘ</button>` : ""}<div class="a-hdr-meta">${badgeHtml}<div class="a-reps">${aReps(ex.sets)}</div></div></div>
      <div class="a-strip"><div class="a-cell"><span class="k">Sets</span><span class="v"><span data-field="sets">${esc(ex.sets)}</span></span></div><div class="a-cell"><span class="k">Rest</span><span class="v">${esc(rest)}</span></div></div>
      <div class="a-timerbar">${makeRestTimer(rest, ex.name)}</div>
      ${noteHtml}
    </div>
  </div>`;
}

function render() {
  const w = WORKOUTS[activeIdx];
  const tabsHtml = WORKOUTS.map((wo,i) =>
    `<button class="tab ${i===activeIdx?'active':''}" data-i="${i}">${esc(wo.label)}</button>`
  ).join("");
  const noteHtml = w.note ? `<div class="workout-note">${esc(w.note)}</div>` : "";
  const latsHtml = w.lats.map((e,i) => renderEx(e,"l",i)).join("");
  const trapsHtml = w.traps.map((e,i) => renderEx(e,"t",i)).join("");
  const bicepsHtml = w.biceps.map((e,i) => renderEx(e,"b",i)).join("");

  document.getElementById("app").innerHTML = `
    <div class="header">
      <a href="cat-pump-new4.html" class="back-link">← Back</a>
      <div class="header-inner">
        <div class="eyebrow">⏱️ Split #4 · Time Under Tension</div>
        <div class="title">Pull — Lats /<br>Traps / Biceps</div>
        <div><span class="schedule">6 Workout Variations</span></div>
      </div>
    </div>
    <div class="tabs-bar"><div class="tabs">${tabsHtml}</div></div>
    <div class="content">
      <div class="workout-title">${esc(w.title)}</div>
      ${noteHtml}
      <div class="tap-hint">Tap any exercise to check off</div>
      <div class="section-label" style="background:rgba(167,139,250,0.15);color:#a78bfa;">🔙 LATS</div>
      ${latsHtml}
      <div class="section-label" style="background:rgba(167,139,250,0.1);color:#c4b5fd;">🏔️ TRAPS</div>
      ${trapsHtml}
      <div class="section-label" style="background:rgba(167,139,250,0.08);color:#ddd6fe;">💪 BICEPS</div>
      ${bicepsHtml}
    </div>`;

  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
    activeIdx = parseInt(b.dataset.i); render();
  }));
  document.querySelectorAll(".ex-card").forEach(c => c.addEventListener("click", () => {
    const id = c.dataset.id; checkState[id] = !checkState[id]; c.classList.toggle("checked");
  }));
}

render();
if(typeof updateProgress!=="undefined")updateProgress();


</script>
