<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font-ui);-webkit-tap-highlight-color:transparent;}
body{background:#0a0a09;min-height:100vh;padding-bottom:210px;color:#ede7d9;}
.app{background:linear-gradient(160deg,#3f0a0a 0%,#1a0f1a 38%,#0f172a 100%);min-height:100vh;}
.back-link{position:absolute;top:18px;left:18px;color:#fca5a5;text-decoration:none;font-size:13px;font-weight:700;background:rgba(220,38,38,0.18);padding:6px 14px;border-radius:20px;border:1px solid rgba(248,113,113,0.4);z-index:10;min-height:48px;display:inline-flex;align-items:center;box-sizing:border-box;}
.back-link:active{background:rgba(220,38,38,0.35);}
.header{background:linear-gradient(90deg,#7f1d1d,#3f0a0a);padding:52px 20px 18px;border-bottom:1px solid rgba(255,255,255,0.1);position:relative;}
.header-inner{max-width:680px;margin:0 auto;}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:0.25em;color:#fca5a5;text-transform:uppercase;margin-bottom:8px;}
.title{font-size:23px;font-weight:900;color:#fff;margin-bottom:8px;letter-spacing:-0.02em;}
.schedule{display:inline-block;background:rgba(249,115,22,0.18);border:1px solid rgba(249,115,22,0.5);border-radius:6px;padding:5px 14px;font-size:12px;color:#fed7aa;font-weight:700;letter-spacing:0.04em;}
.content{max-width:680px;margin:16px auto 0;padding:0 16px;}
.intro-warn{background:rgba(220,38,38,0.1);border-left:3px solid #dc2626;border-radius:0 8px 8px 0;padding:12px 14px;margin-bottom:16px;color:#fecaca;font-size:12.5px;line-height:1.6;}
.intro-warn strong{color:#fff;}
.sec-head{font-size:11px;font-weight:900;letter-spacing:0.2em;color:#fdba74;text-transform:uppercase;margin:14px 0 8px;display:flex;align-items:center;gap:10px;}
.sec-head::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(249,115,22,0.4),transparent);}

.pstep{background:linear-gradient(155deg,#111a2b,#0c1320);border-radius:16px;border:1.5px solid rgba(252,250,245,0.5);padding:11px 12px;margin-bottom:9px;box-shadow:0 8px 26px rgba(0,0,0,0.4);transition:border-color .2s,opacity .2s;}
.pstep.locked{border-color:rgba(252,250,245,0.12);opacity:0.5;pointer-events:none;}
.pstep.active{border-color:rgba(251,146,60,0.9);box-shadow:0 8px 32px rgba(220,38,38,0.28);opacity:1;}
.pstep.done{border-color:rgba(52,211,153,0.8);box-shadow:0 6px 22px rgba(16,185,129,0.18);opacity:0.92;}
.pstep-top{display:flex;align-items:center;gap:12px;}
.pstep-stepnum{background:linear-gradient(135deg,#f97316,#dc2626);color:#fff;font-size:12px;font-weight:900;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 12px rgba(220,38,38,0.4);}
.pstep.done .pstep-stepnum{background:linear-gradient(135deg,#34d399,#059669);}
.pstep-ico{font-size:24px;flex-shrink:0;line-height:1;}
.pstep-main{flex:1;min-width:0;}
.pstep-name{font-size:14px;font-weight:900;color:#fff;letter-spacing:-0.01em;}
.pstep-target{font-size:11.5px;color:#a8a196;font-weight:700;margin-top:2px;}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:900;letter-spacing:0.06em;padding:4px 9px;border-radius:8px;white-space:nowrap;text-transform:uppercase;flex-shrink:0;}
.badge.crimson{background:linear-gradient(135deg,#f97316,#dc2626);color:#fff;box-shadow:0 2px 10px rgba(220,38,38,0.3);}
.badge.work{background:linear-gradient(135deg,#f97316,#dc2626);color:#fff;animation:badgePulse 1s ease-in-out infinite;}
.badge.rest{background:linear-gradient(135deg,#0ea5e9,#0369a1);color:#fff;}
.badge.green{background:linear-gradient(135deg,#34d399,#059669);color:#06281d;}
.badge.idle{background:rgba(168,161,150,0.14);color:#a8a196;border:1px solid rgba(168,161,150,0.22);}
@keyframes badgePulse{0%,100%{opacity:1;}50%{opacity:0.78;}}

/* interval runner */
.rn-wrap{margin-top:12px;}
.rn-roundline{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.rn-move{font-size:13px;font-weight:900;color:#fdba74;letter-spacing:0.02em;}
.rn-disp{font-size:46px;font-weight:900;color:#ede7d9;font-variant-numeric:tabular-nums;letter-spacing:-0.03em;line-height:0.95;text-align:center;margin:4px 0 2px;}
.rn-disp.work{color:#f87171;}.rn-disp.rest{color:#38bdf8;}.rn-disp.done{color:#34d399;}
.rn-phaselabel{text-align:center;font-size:11px;font-weight:900;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.rn-ctrls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px;}
.rn-ctrl{padding:9px 16px;border-radius:11px;border:none;cursor:pointer;font-size:12px;font-weight:800;letter-spacing:0.06em;font-family:inherit;}
.rn-ctrl.go{background:linear-gradient(135deg,#f97316,#dc2626);color:#fff;box-shadow:0 4px 16px rgba(220,38,38,0.35);}
.rn-ctrl.pause{background:rgba(251,146,60,0.16);color:#fb923c;border:1px solid rgba(251,146,60,0.35);}
.rn-ctrl.skip{background:rgba(14,165,233,0.14);color:#7dd3fc;border:1px solid rgba(14,165,233,0.3);}
.rn-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;justify-content:center;}
.rn-chip{font-size:11px;font-weight:800;padding:5px 10px;border-radius:8px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);color:var(--muted);}
.rn-chip.done{border-color:rgba(52,211,153,0.45);background:rgba(52,211,153,0.12);color:#6ee7b7;}
.rn-chip.current{border-color:#f87171;background:rgba(220,38,38,0.18);color:#fff;}

/* embedded countdown / count-up */
.cd-box{background:rgba(0,0,0,0.28);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:11px;margin-top:10px;text-align:center;}
.cd-mini-label{font-size:11px;font-weight:900;letter-spacing:0.2em;color:var(--muted);text-transform:uppercase;margin-bottom:8px;}
.cd-disp{font-size:38px;font-weight:900;color:#ede7d9;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;line-height:1;}
.cd-disp.running{color:#fb923c;}.cd-disp.done{color:#34d399;}
.cd-prog{height:5px;background:rgba(255,255,255,0.07);border-radius:3px;overflow:hidden;margin:11px 0 12px;}
.cd-prog-fill{height:100%;width:0%;background:linear-gradient(90deg,#f97316,#dc2626);border-radius:3px;transition:width 0.25s linear;}
.cd-prog-fill.done{background:#34d399;}
.cd-btns{display:flex;gap:8px;justify-content:center;}
.cd-btn{padding:8px 16px;border-radius:10px;border:none;cursor:pointer;font-size:12px;font-weight:800;letter-spacing:0.06em;font-family:inherit;}
.cd-btn.go{background:rgba(52,211,153,0.16);color:#34d399;border:1px solid rgba(52,211,153,0.35);}
.cd-btn.pause{background:rgba(251,146,60,0.16);color:#fb923c;border:1px solid rgba(251,146,60,0.35);}
.cd-btn.ghost{background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,0.12);}

.log-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;}
.log-row label{font-size:11px;color:#a8a196;font-weight:700;}
.log-input{width:104px;padding:9px;background:rgba(0,0,0,0.3);border:1.5px solid rgba(249,115,22,0.4);border-radius:12px;color:#fff;font-size:22px;font-weight:900;text-align:center;font-family:inherit;outline:none;font-variant-numeric:tabular-nums;}
.log-input:focus{border-color:#f97316;}
.pstep-complete{width:100%;margin-top:12px;padding:13px;border-radius:12px;border:none;cursor:pointer;font-size:14px;font-weight:900;letter-spacing:0.03em;font-family:inherit;background:linear-gradient(135deg,#34d399,#059669);color:#06281d;}
.pstep-complete:active{transform:scale(0.99);}
.pstep-complete:disabled{background:rgba(255,255,255,0.05);color:var(--muted);cursor:not-allowed;}

.done-banner{display:none;background:linear-gradient(135deg,#34d399,#059669);border-radius:16px;padding:18px;text-align:center;margin-bottom:16px;box-shadow:0 8px 30px rgba(16,185,129,0.4);}
.done-banner.show{display:block;}
.done-banner .db-t{font-size:20px;font-weight:900;color:#06281d;}
.done-banner .db-s{font-size:13px;font-weight:700;color:#06281d;opacity:0.85;margin-top:4px;}

.sum-drawer{position:fixed;left:0;right:0;bottom:60px;z-index:120;background:rgba(12,12,11,0.97);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1.5px solid rgba(248,113,113,0.4);box-shadow:0 -8px 30px rgba(0,0,0,0.55);}
.sum-handle{display:flex;align-items:center;gap:12px;padding:11px 16px calc(11px + env(safe-area-inset-bottom));cursor:pointer;user-select:none;}
.sum-handle-title{font-size:11px;font-weight:900;letter-spacing:0.14em;text-transform:uppercase;color:#fdba74;}
.sum-quick{margin-left:auto;display:flex;gap:14px;align-items:center;}
.sum-quick-item{text-align:right;}
.sum-quick-v{font-size:17px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;line-height:1;}
.sum-quick-l{font-size:9px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:#a8a196;margin-top:2px;}
.sum-chev{font-size:12px;color:var(--muted);transition:transform 0.25s;}
.sum-drawer.open .sum-chev{transform:rotate(180deg);}
.sum-detail{max-height:0;overflow:hidden;transition:max-height 0.3s ease;}
.sum-drawer.open .sum-detail{max-height:360px;}
.sum-detail-inner{padding:4px 16px 16px;}
.sum-line{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.06);}
.sum-line:last-child{border-bottom:none;}
.sum-line-ico{font-size:17px;width:24px;text-align:center;flex-shrink:0;}
.sum-line-nm{font-size:13px;font-weight:700;color:#d9d3c8;flex:1;}
.sum-line-v{font-size:14px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;}
.sum-line-v small{font-size:11px;color:#a8a196;font-weight:700;}
.sum-reset{width:100%;margin-top:12px;padding:11px;border-radius:10px;border:1px solid rgba(255,255,255,0.12);background:transparent;color:var(--muted);font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:0.04em;}

.prog-bar-wrap{position:fixed;top:0;left:0;right:0;height:3px;z-index:999;background:rgba(255,255,255,0.06);}
.prog-bar-fill{height:3px;width:0%;background:linear-gradient(90deg,#f97316,#dc2626);transition:width 0.4s ease;border-radius:0 2px 2px 0;}
</style>

<body class="cond-elite bc-page">
<div class="prog-bar-wrap"><div class="prog-bar-fill" id="progFill"></div></div>
<div class="app">
  <div class="header">
    <a href="dashboard.html?tab=conditioning" class="back-link">← Back</a>
    <div class="header-inner">
      <div class="eyebrow">🥊 Fight Camp</div>
      <h1 class="title">12-Week Boxing Camp</h1>
      <div><span class="schedule" id="bcSchedule">Phase 1</span></div>
    </div>
  </div>
  <div class="content">
    <div class="bc-phases" id="bcPhases" role="tablist" aria-label="Camp phase"></div>
    <div class="bc-strip" id="bcStrip"></div>

    <details class="bc-legend">
      <summary><span class="bc-legend-t">Punch key</span><span class="bc-legend-keys" id="bcLegendKeys"></span></summary>
      <div class="bc-legend-grid" id="bcLegendGrid"></div>
    </details>

    <section class="bc-board-wrap" aria-label="Heavy bag combinations">
      <div class="sec-head">Heavy Bag Combos</div>
      <div class="bc-board-ctrls">
        <div class="bc-rounds" id="bcRounds"></div>
        <div class="bc-mode" id="bcMode">
          <button type="button" data-mode="all" aria-pressed="true">All</button>
          <button type="button" data-mode="new" aria-pressed="false">New only</button>
        </div>
      </div>
      <div class="bc-board-head" id="bcBoardHead"></div>
      <div class="bc-board" id="bcBoard"></div>
    </section>

    <div class="done-banner" id="doneBanner">
      <div class="db-t">🏆 Camp Session Complete</div>
      <div class="db-s">Every round and finisher logged. Totals are below.</div>
    </div>
    <div id="timelineMount"></div>
  </div>
</div>

<div class="sum-drawer" id="sumDrawer">
  <div class="sum-handle" id="sumHandle" role="button" tabindex="0" aria-expanded="false" aria-controls="sumDetail">
    <div class="sum-handle-title"><span id="sumTitleText">📊 Summary</span> · <span id="sumStep">Step 0 / 0</span></div>
    <div class="sum-quick">
      <div class="sum-quick-item"><div class="sum-quick-v" id="qMin">0</div><div class="sum-quick-l">Active Min</div></div>
      <div class="sum-quick-item"><div class="sum-quick-v" id="qRounds">0</div><div class="sum-quick-l">Rounds</div></div>
      <span class="sum-chev">▲</span>
    </div>
  </div>
  <div class="sum-detail" id="sumDetail">
    <div class="sum-detail-inner">
      <div class="sum-line"><span class="sum-line-ico">⏱️</span><span class="sum-line-nm">Active time</span><span class="sum-line-v" id="dMin">0:00</span></div>
      <div class="sum-line"><span class="sum-line-ico">🥊</span><span class="sum-line-nm">Rounds complete</span><span class="sum-line-v" id="dRounds">0 <small>/ 0</small></span></div>
      <div class="sum-line"><span class="sum-line-ico">🔥</span><span class="sum-line-nm">Sit-ups to failure</span><span class="sum-line-v" id="dSit">— <small>reps</small></span></div>
      <div class="sum-line" id="dRunRow"><span class="sum-line-ico">🏃</span><span class="sum-line-nm">Run</span><span class="sum-line-v" id="dRun">— <small>mi</small></span></div>
      <button type="button" class="sum-reset" id="sumReset">↺ Reset Session</button>
    </div>
  </div>
</div>
