<script>// ── TIMER ENGINE ──
buildTimerFloat();

function makeRestTimer(r, n) {
  var s = TMR.parseSeconds(r);
  if (!s) return '<span style="opacity:0.5">' + r + '</span>';
  var nm = (n||'').substring(0,25).replace(/['"/\\]/g,'');
  return '<span class="rest-timer idle" data-rest="' + r + '" ' +
    'onclick="buildTimerFloat();TMR.toggle(this,' + s + ',&quot;' + nm + '&quot;)" ' +
    'title="Tap to start">' +
    '<span class="rest-timer-label">' + r + '</span></span>';
}


// Renamed from EXERCISES to avoid colliding with the shared exercise-catalog.js
// global (var EXERCISES), which lazy-loads via mc-card-actions.js after this
// script runs — the name clash threw "Identifier 'EXERCISES' has already been
// declared" and left the substitute catalog unregistered on this page.
const PAGE_EXERCISES = [
  {name:"Slight Incline DB Press", sets:"5×8", tempo:"4:0:1:0"},
  {name:"Decline Cable Flies", sets:"5×20"},
  {name:"Incline DB Row", sets:"4×8", tempo:"4:0:1:0"},
  {name:"Straight Arm Lat Pulldowns", sets:"4×20"},
  {name:"Machine Shoulder Press", sets:"4×8", tempo:"4:0:1:0"},
  {name:"Machine Side Laterals", sets:"4×20"},
  {name:"Barbell Preacher Curl / Tricep Extension", sets:"4×8/8", tempo:"4:0:1:0"},
  {name:"Cable Curl (shoulder width) / Tricep Pushdowns (rope)", sets:"4×20/20"},
];

const checkState = {};
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}


function renderEx(ex, idx) {
  const id = `ex-${idx}`;
  const checked = checkState[id] ? "checked" : "";
  const rest = ex.rest || "60 sec";
  const badgeHtml = ex.tempo ? `<div class="a-badges"><span class="ex-tempo">${escapeHtml(ex.tempo)}</span></div>` : "";
  const noteHtml = ex.note ? `<div class="a-notes">📝 ${escapeHtml(ex.note)}</div>` : "";
  return `<div class="ex-card a-card ${checked}" data-id="${id}" data-type="single">
    <div class="ex-body">
      <div class="a-top"><div class="a-idx">${idx+1}</div><div class="a-head"><div class="ex-name a-name">${escapeHtml(ex.name)}</div>${badgeHtml}</div></div>
      <div class="a-reps">${aReps(ex.sets)}</div>
      <div class="a-strip"><div class="a-cell"><span class="k">Sets</span><span class="v"><span data-field="sets">${escapeHtml(ex.sets)}</span></span></div><div class="a-cell"><span class="k">Rest</span><span class="v">${escapeHtml(rest)}</span></div></div>
      <div class="a-timerbar">${makeRestTimer(rest, ex.name)}</div>
      ${noteHtml}
    </div>
  </div>`;
}


function render() {
  document.getElementById("app").innerHTML = `
    <div class="header">
      <a href="cat-pump-new4.html" class="back-link">← Back</a>
      <div class="header-inner">
        <div class="eyebrow">🔶 Split #3 · Full Body</div>
        <div class="title">Upper Body</div>
        <div><span class="schedule">Full Upper Body Circuit</span></div>
      </div>
    </div>
    <div class="content" style="margin-top:24px;">
      <div class="workout-title">Upper Body — Strength + High Rep Pairs</div>
      <div class="tap-hint">Tap any exercise to check off</div>
      ${PAGE_EXERCISES.map((e,i) => renderEx(e,i)).join("")}
    </div>`;
  document.querySelectorAll(".ex-card").forEach(c => c.addEventListener("click", () => {
    const id = c.dataset.id; checkState[id]=!checkState[id]; c.classList.toggle("checked");
  }));
}
render();
if(typeof updateProgress!=="undefined")updateProgress();
