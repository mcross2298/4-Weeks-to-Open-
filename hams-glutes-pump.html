buildTimerFloat();



const WORKOUTS = [
  {id:"w1",label:"W1",remix:false,title:"Strength + Good Morning",exercises:[
    {name:"Seated Leg Curl (feet shoulder width)",sets:"12, 10, 8, 8"},
    {name:"Barbell Stiff Leg Deadlift",sets:"4×4"},
    {name:"Seated Leg Curl (feet touching)",sets:"4×12"},
    {name:"Barbell Good Morning (feet touching)",sets:"8, 6, 4",tempo:"1:2:1:0"},
    {name:"Smith Machine Squat (sumo stance)",sets:"12, 10, 8, 8"},
    {name:"Barbell Hip Thrust",sets:"6×4"},
    {name:"Barbell Squat (outside shoulder width)",sets:"8, 6, 4",tempo:"1:2:1:0"},
  ]},
  {id:"w2",label:"W2",remix:false,title:"Drop Set Heavy",exercises:[
    {name:"Lying Leg Curl",sets:"12, 10, 8, 6, 4 drop 20"},
    {name:"Seated Leg Curl",sets:"12, 10, 8, 8"},
    {name:"Barbell Good Morning (shoulder width) / DB Stiff Leg Deadlift",sets:"4×12/12",tempo:"1:2:1:0"},
    {name:"Leg Press (feet high and wide)",sets:"12, 10, 8, 6, 4 drop 20"},
    {name:"Barbell Hip Thrust",sets:"12, 10, 8, 8"},
    {name:"Barbell Walking Lunge",sets:"3×8",tempo:"1:2:1:0"},
  ]},
  {id:"w3",label:"W3",remix:false,title:"Pyramid + Tempo Pairs",exercises:[
    {name:"Deficit Barbell Stiff Leg Deadlift (inside shoulder width)",sets:"12, 10, 8, 6, 6, 8, 10, 12"},
    {name:"Lying Leg Curl / Seated Leg Curl",sets:"4×6/10",tempo:"4:0:1:0 / 1:0:1:2"},
    {name:"Barbell Hip Thrust",sets:"12, 10, 8, 6, 6, 8, 10, 12"},
    {name:"Leg Press (feet high & shoulder width) / Hack Squat (feet high & shoulder width)",sets:"4×6/10",tempo:"4:0:1:0 / 1:2:1:0"},
  ]},
  {id:"w4",label:"W4",remix:false,title:"Pause & Isometric",exercises:[
    {name:"Seated Leg Curl",sets:"5×5",tempo:"1:5:1:0"},
    {name:"Leg Press (feet high and outside shoulder width)",sets:"3×5",tempo:"1:5:1:0"},
    {name:"Stiff Leg Deadlift (using seated cable row)",sets:"12, 10, 8, 6, 4 drop 12"},
    {name:"Barbell Hip Thrust",sets:"12, 10, 8, 6"},
    {name:"Flat Bench Dumbbell Leg Curl",sets:"4×8",tempo:"4:0:1:0"},
    {name:"Smith Machine Squat (outside shoulder width)",sets:"3×8",tempo:"4:0:1:0"},
    {name:"Reverse Lying Leg Curl Hip Thrust",sets:"30, 30, 20, 20, 10, 10"},
  ]},
  {id:"w5",label:"W5",remix:true,title:"Curl-First Volume",exercises:[
    {name:"Lying Leg Curl",sets:"12, 10, 8, 8"},
    {name:"Flat Bench Dumbbell Leg Curl",sets:"4×8",tempo:"4:0:1:0"},
    {name:"Seated Leg Curl (feet touching)",sets:"4×12"},
    {name:"Deficit Barbell Stiff Leg Deadlift (inside shoulder width)",sets:"12, 10, 8, 6"},
    {name:"Barbell Hip Thrust",sets:"12, 10, 8, 8"},
    {name:"Smith Machine Squat (sumo stance)",sets:"12, 10, 8, 8"},
    {name:"Barbell Walking Lunge",sets:"3×8",tempo:"1:2:1:0"},
    {name:"Reverse Lying Leg Curl Hip Thrust",sets:"30, 20, 10"},
  ]},

    {name:"Barbell Stiff Leg Deadlift",sets:"6×4"},

    {name:"Seated Leg Curl (feet shoulder width)",sets:"12, 10, 8, 8"},
    {name:"Barbell Hip Thrust",sets:"6×4"},
    {name:"Leg Press (feet high and wide)",sets:"12, 10, 8, 8"},
    {name:"Barbell Squat (outside shoulder width)",sets:"8, 6, 4",tempo:"1:2:1:0"},
    {name:"Seated Leg Curl (feet touching)",sets:"4×12"},
  ]},
  {id:"w7",label:"W7",remix:true,title:"Drop Set + Pause Hybrid",exercises:[
    {name:"Seated Leg Curl",sets:"5×5",tempo:"1:5:1:0"},
    {name:"Lying Leg Curl",sets:"12, 10, 8, 6, 4 drop 20"},
    {name:"Stiff Leg Deadlift (using seated cable row)",sets:"12, 10, 8, 6, 4 drop 12"},
    {name:"Barbell Good Morning (shoulder width) / DB Stiff Leg Deadlift",sets:"4×12/12",tempo:"1:2:1:0"},
    {name:"Leg Press (feet high and outside shoulder width)",sets:"3×5",tempo:"1:5:1:0"},
    {name:"Barbell Hip Thrust",sets:"12, 10, 8, 6, 4 drop 20"},
    {name:"Smith Machine Squat (outside shoulder width)",sets:"3×8",tempo:"4:0:1:0"},
  ]},
  {id:"w8",label:"W8",remix:true,title:"Pyramid + High Rep Finisher",exercises:[
    {name:"Lying Leg Curl / Seated Leg Curl",sets:"4×6/10",tempo:"4:0:1:0 / 1:0:1:2"},
    {name:"Deficit Barbell Stiff Leg Deadlift (inside shoulder width)",sets:"12, 10, 8, 6, 6, 8, 10, 12"},
    {name:"Barbell Hip Thrust",sets:"12, 10, 8, 6, 6, 8, 10, 12"},
    {name:"Flat Bench Dumbbell Leg Curl",sets:"4×8",tempo:"4:0:1:0"},
    {name:"Leg Press (feet high & shoulder width) / Hack Squat (feet high & shoulder width)",sets:"4×6/10",tempo:"4:0:1:0 / 1:2:1:0"},
    {name:"Barbell Walking Lunge",sets:"3×8",tempo:"1:2:1:0"},
    {name:"Reverse Lying Leg Curl Hip Thrust",sets:"30, 30, 20, 20, 10, 10"},
  ]},
];

let activeIdx=0;
const checkState={};




function render(){
  const w=WORKOUTS[activeIdx];
  const tabsHtml=WORKOUTS.map((wo,i)=>
    `<button class="tab ${wo.remix?'remix':''} ${i===activeIdx?'active':''}" data-i="${i}">${escapeHtml(wo.label)}</button>`
  ).join("");
  const exHtml=w.exercises.map((e,i)=>renderExercise(e,i)).join("");
  const remixHtml=w.remix?`<div class="remix-badge">🔀 Remixed Variation</div>`:'<div style="margin-bottom:12px"></div>';

  document.getElementById("app").innerHTML=`
    <div class="header">
      <a href="cat-pump-new4.html" class="back-link">← Back</a>
      <div class="header-inner">
        <div class="eyebrow">🍑 Hamstrings · Glutes</div>
        <div class="title">Hamstrings & Glutes</div>
        <div><span class="schedule">8 Workout Variations</span></div>
      </div>
    </div>
    <div class="tabs-bar"><div class="tabs">${tabsHtml}</div></div>
    <div class="content">
      <div class="workout-title">${escapeHtml(w.title)}</div>
      ${remixHtml}
      <div class="tap-hint">Tap any exercise to check off</div>
      ${exHtml}
    </div>`;

  document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{activeIdx=parseInt(b.dataset.i);render();}));
  document.querySelectorAll(".ex-card").forEach(c=>c.addEventListener("click",()=>{
    const id=c.dataset.id;checkState[id]=!checkState[id];c.classList.toggle("checked");
  }));
}
render();
if(typeof updateProgress!=="undefined")updateProgress();
