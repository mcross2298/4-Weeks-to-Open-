  *{box-sizing:border-box;margin:0;padding:0;}
  :root{

    content:'';

    background-size:48px 48px;
    pointer-events:none;z-index:0;
  }

  .wrap{max-width:640px;margin:0 auto;padding:40px 20px 80px;position:relative;z-index:1;}

  .header{margin-bottom:44px;text-align:center;}
  .eyebrow{
    display:inline-block;font-size:11px;font-weight:700;
    letter-spacing:0.35em;text-transform:uppercase;
    color:var(--gold);background:var(--gold-dim);
    border:1px solid rgba(251,191,36,0.25);
    padding:5px 16px;border-radius:20px;margin-bottom:16px;
  }
  h1{
    font-family:var(--font-display);
    font-size:clamp(52px,12vw,80px);
    letter-spacing:0.04em;line-height:0.95;
    background:linear-gradient(160deg,#fff 40%,#94a3b8);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  }
  .header-sub{font-size:13px;color:var(--muted);font-weight:500;margin-top:12px;letter-spacing:0.03em;}
  .pulse-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:7px;animation:pulse 2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(0.7);}}

  .inst-link{
    display:inline-flex;align-items:center;gap:7px;
    margin-bottom:32px;text-decoration:none;
    background:rgba(251,191,36,0.08);
    border:1px solid rgba(251,191,36,0.25);
    color:var(--gold);font-size:11px;font-weight:700;
    padding:9px 18px;border-radius:20px;
    letter-spacing:0.06em;text-transform:uppercase;
    transition:background 0.15s;
  }
  .inst-link:active{background:rgba(251,191,36,0.15);}

  .modules{display:flex;flex-direction:column;gap:16px;}

  .module{border-radius:20px;overflow:hidden;cursor:pointer;transition:transform 0.18s,box-shadow 0.18s;user-select:none;}
  .module:active{transform:scale(0.985);}

  .module-header{display:flex;align-items:center;padding:22px 24px;position:relative;gap:16px;}
  .module-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
  .module-label{flex:1;}
  .module-tag{font-size:11px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;margin-bottom:4px;opacity:0.8;}
  .module-name{font-family:var(--font-display);font-size:28px;letter-spacing:0.06em;line-height:1;}
  .module-count{font-size:11px;font-weight:500;opacity:0.6;margin-top:3px;letter-spacing:0.02em;}
  .chevron{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;transition:transform 0.25s;flex-shrink:0;}
  .module.open .chevron{transform:rotate(90deg);}

  .drill{max-height:0;overflow:hidden;transition:max-height 0.4s cubic-bezier(0.4,0,0.2,1);}
  .module.open .drill{max-height:1400px;}
  .drill-inner{padding:0 20px 20px;}
  .drill-divider{height:1px;margin-bottom:16px;opacity:0.25;}

  .workout-row{display:flex;align-items:center;padding:14px 16px;border-radius:12px;margin-bottom:8px;text-decoration:none;color:inherit;gap:14px;transition:background 0.15s;cursor:pointer;}
  .workout-row:last-child{margin-bottom:0;}
  .row-emoji{font-size:18px;flex-shrink:0;width:28px;text-align:center;}
  .row-text{flex:1;}
  .row-name{font-size:15px;font-weight:700;letter-spacing:-0.01em;}
  .row-detail{font-size:11px;font-weight:500;margin-top:2px;opacity:0.6;}
  .row-badge{font-size:11px;font-weight:800;letter-spacing:0.15em;text-transform:uppercase;padding:4px 9px;border-radius:6px;white-space:nowrap;}
  .row-arrow{font-size:12px;opacity:0.5;}

  .m-gold .drill-divider{background:var(--gold);}
  .m-gold .workout-row:hover{background:rgba(251,191,36,0.07);}
  .m-gold .row-name{color:#fde68a;}
  .m-gold .row-detail{color:#fbbf24;}
  .m-gold .row-badge{background:rgba(251,191,36,0.12);color:#fbbf24;border:1px solid rgba(251,191,36,0.22);}

  .m-green .module-icon{background:var(--green-dim);border:1px solid rgba(52,211,153,0.25);}
