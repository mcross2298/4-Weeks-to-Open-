let activeIdx = 0;
const checkState = {};




function render() {
  const w = WORKOUTS[activeIdx];
  const tabsHtml = WORKOUTS.map((wo,i) => `<button class="tab ${i===activeIdx?'active':''}" data-i="${i}">${wo.label}</button>`).join("");
  const backHtml = w.back.map((e,i) => renderEx(e,'b',i)).join("");
  const trapsHtml = w.traps.map((e,i) => renderEx(e,'t',i)).join("");
  document.getElementById("app").innerHTML = `
    <div class="header">
      <a href="cat-pump-new4.html" class="back-link">← Back</a>
      <div class="header-inner">
        <div class="eyebrow">🔶 Split #3 · Back</div>
        <div class="title">Back & Traps</div>
        <div><span class="schedule">7 Workout Variations</span></div>
      </div>

    <div class="content">
      <div class="workout-title">${escapeHtml(w.title)}</div>
      <div class="tap-hint">Tap any exercise to check off</div>
      <div class="section-label back">Back</div>${backHtml}
      <div class="section-label traps">Traps</div>${trapsHtml}
    </div>`;
  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => { activeIdx=parseInt(b.dataset.i); render(); }));
  document.querySelectorAll(".ex-card").forEach(c => c.addEventListener("click", () => { const id=c.dataset.id; checkState[id]=!checkState[id]; c.classList.toggle("checked"); }));
}
