      {name:"Barbell Floor Press", sets:"4×8"},
      {name:"Pec Deck", sets:"12, 10, 8, 8"},
      {name:"Flat Bench Cable Fly", sets:"4×12", tempo:"1:0:1:2"},
      {name:"Pushups", sets:"3×failure", tempo:"1:2:1:2"},
    ],
    tri:[
      {name:"Double Arm Overhead Extension", sets:"4×4"},
      {name:"Hands Touching Skullcrushers", sets:"4×6"},
      {name:"Tricep Pushdowns (rope)", sets:"4×8"},
      {name:"Diamond Pushups", sets:"3×failure", tempo:"1:2:1:2"},
    ]
  },
  {
    id:"w2", label:"W2",
    title:"Chest & Triceps — Descending Pyramid",
    chest:[
      {name:"Decline Cable Flies", sets:"50, 40, 30, 20, 10"},
      {name:"Incline Machine Press / Decline Machine Press", sets:"4×80/30", tempo:"4:0:1:0 / no tempo"},
      {name:"High Incline DB / Slight Incline DB / Flat DB Fly", sets:"3×10/15/20"},
      {name:"Incline Bench", sets:"4×6", tempo:"4:0:1:0"},
      {name:"Pushups", sets:"3×failure"},
    ],
    tri:[
      {name:"Rope Pushdowns", sets:"50, 40, 30, 20, 10"},
      {name:"Double Arm Overhead Extensions / Double Arm DB Incline Kickbacks", sets:"4×8/30", tempo:"4:0:1:0 / no tempo"},

    ]
  },
  {

    chest:[
      {name:"Bench", sets:"4×4"},
      {name:"Incline Machine Press", sets:"15, 12, 10, 8"},
      {name:"Slight Incline DB Press", sets:"12, 10, 8, 8"},
      {name:"Pec Deck", sets:"10, 8, 6, 6 drop 8, 10, 12"},
      {name:"Weighted Chest Dips", sets:"4×4", tempo:"1:2:1:0"},
    ],
    tri:[
      {name:"Double Arm Overhead Extension", sets:"12, 10, 8, 8"},

      {name:"Tricep Pushdowns", sets:"10, 8, 6, 6 drop 8, 10, 12"},
      {name:"Close Grip Bench", sets:"4×4", tempo:"1:2:1:0"},
    ]
  },
  {
    id:"w4", label:"W4",
    title:"Chest & Triceps — Cable & Tempo Focus",
    chest:[
      {name:"Decline Cable Flies", sets:"4×12", tempo:"4:0:1:2"},
      {name:"Flat DB Press / Reverse Grip Bench", sets:"3×10/20", tempo:"4:0:1:0 / no tempo"},
      {name:"Incline DB Press / Incline DB Fly", sets:"4×10/6", tempo:"4:0:1:0 / 1:5:1:0"},
      {name:"Bench", sets:"4×4", tempo:"10:1:0:1"},
      {name:"Chest Dips", sets:"3×failure"},
    ],
    tri:[
      {name:"Tricep Pushdowns (W bar)", sets:"4×12", tempo:"4:0:1:2"},
      {name:"Double Arm Overhead Extension / Tricep Pushdowns (rope)", sets:"4×10/6", tempo:"4:0:1:0 / 1:5:1:0"},
      {name:"Skullcrushers / V Grip Tricep Pushdowns", sets:"4×10/20", tempo:"4:0:1:0 / no tempo"},
      {name:"Diamond Pushups", sets:"4×failure"},
    ]
  },
  {
    id:"w5", label:"W5",
    title:"Chest & Triceps — Drop Set Heavy",
    chest:[
      {name:"Slight Incline DB Fly", sets:"15, 12, 10, 10 drop 12/15"},
      {name:"Pin Rack Bench", sets:"6×6", tempo:"1:2:1:0"},
      {name:"Slight Incline DB Press", sets:"12, 12, 10, 10, 8, 8"},
      {name:"Decline Cable Flies", sets:"15, 12, 10", tempo:"1:0:1:2"},
      {name:"Incline Hex Press", sets:"15, 12, 10", tempo:"1:2:1:2"},
    ],
    tri:[
      {name:"Tricep Pushdowns (shoulder width)", sets:"15, 12, 10, 10 drop 12/15"},
      {name:"Double Arm Overhead Pin Rack Extensions", sets:"6×6", tempo:"1:2:1:0"},
      {name:"Flat Skullcrushers (hands touching)", sets:"12, 12, 10, 10"},
      {name:"Tricep Pushdowns (rope attachment)", sets:"15, 12, 10", tempo:"1:0:1:2"},

  },

      {name:"Incline DB Press / Flat DB Press", sets:"4×12/4", tempo:"4:0:1:0 / 1:10:1:0"},
      {name:"Flat Barbell Press", sets:"4×4", tempo:"4:2:1:0"},
      {name:"Bodyweight Push Up", sets:"3×failure", tempo:"4:2:1:0"},
    ],
    tri:[
      {name:"Tricep Cable Press Down (V grip)", sets:"30, 30, 25, 25, 20, 20"},
      {name:"Machine Tricep Press Down", sets:"4×20"},
      {name:"Flat Bench DB Skull Crusher / Seated Double Arm Overhead DB Extension", sets:"4×12/4", tempo:"4:0:1:0 / 1:10:1:0"},
      {name:"Bodyweight Diamond Push Up", sets:"4×failure", tempo:"4:2:1:0"},

  {
    id:"w7", label:"W7",

      {name:"Incline DB Press", sets:"4×10", tempo:"4:0:1:0"},
      {name:"Flat Bench Hammer Press", sets:"6×8", tempo:"4:0:1:0"},
      {name:"Incline / Flat / Decline Cable Fly", sets:"8/10/12"},
    ],
    tri:[
      {name:"Tricep Pushdowns (outside shoulder)", sets:"6×12", tempo:"4:0:1:0"},
      {name:"Tricep Pushdowns (inside shoulder)", sets:"4×12", tempo:"4:0:1:0"},
      {name:"Incline Skullcrushers / DB Overhead Extension / Rope Pushdowns", sets:"4×8/10/12"},
    ]
  },
];

let activeIdx = 0;
const checkState = {};




function render() {
  const w = WORKOUTS[activeIdx];
  const tabsHtml = WORKOUTS.map((wo, i) =>
    `<button class="tab ${i===activeIdx?'active':''}" data-i="${i}">${escapeHtml(wo.label)}</button>`
  ).join("");
  const chestHtml = w.chest.map((e,i) => renderExercise(e,i,"c")).join("");
  const triHtml = w.tri.map((e,i) => renderExercise(e,i,"t","tri")).join("");

  document.getElementById("app").innerHTML = `
    <div class="header">
      <a href="cat-pump-new4.html" class="back-link">← Back</a>
      <div class="header-inner">
        <div class="eyebrow">💪 Chest · Pump</div>
        <div class="title">Chest & Triceps</div>
        <div><span class="schedule">7 Workout Variations</span></div>
      </div>
    </div>
    <div class="tabs-bar"><div class="tabs">${tabsHtml}</div></div>
    <div class="content">
      <div class="workout-title">${escapeHtml(w.title)}</div>
      <div class="tap-hint">Tap any exercise to check off</div>
      <div class="section-label chest">Chest</div>
      ${chestHtml}
      <div class="section-label tri">Triceps</div>
      ${triHtml}
    </div>`;

  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
    activeIdx = parseInt(b.dataset.i); render();
  }));
  document.querySelectorAll(".ex-card").forEach(c => c.addEventListener("click", () => {
    const id = c.dataset.id;
    checkState[id] = !checkState[id];
    c.classList.toggle("checked");
  }));
}

render();
if(typeof updateProgress!=="undefined")updateProgress();




</script>
