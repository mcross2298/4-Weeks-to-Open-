<script>// ── TIMER ENGINE ──
buildTimerFloat();



const WORKOUTS = [
  {
    id:"w1", label:"W1",
    title:"Chest & Biceps — Drop Set Strength",
    chest:[
      {name:"Slight Incline DB Press", sets:"12, 10, 8, 6 drop 12"},
      {name:"Incline Barbell Bench", sets:"4, 4, 4, 4 drop 12"},
      {name:"Flat Bench", sets:"4, 4, 4, 4 drop 12"},
      {name:"Single Arm Machine Press", sets:"12, 10, 8"},
      {name:"Decline / Incline Cable Flies", sets:"3×12"},
    ],
    biceps:[
      {name:"Barbell Preacher Curl (inside shoulder)", sets:"12, 10, 8, 6 drop 12"},
      {name:"Barbell Curl (outside shoulder)", sets:"4, 4, 4, 4 drop 12"},
      {name:"Reverse Grip Barbell Curl", sets:"12, 10, 8, 8"},
      {name:"Incline Spider Curl", sets:"4×8", tempo:"1:0:1:2"},
    ]
  },
  {
    id:"w2", label:"W2",
    title:"Chest & Biceps — Volume Pairing",
    chest:[
      {name:"Incline Machine Press", sets:"12, 10, 8, 8"},
      {name:"DB Flat Bench", sets:"4×10"},
      {name:"Incline DB Hammer Press", sets:"4×8"},
      {name:"Incline DB Fly / Incline Cable Fly", sets:"5×15/12", tempo:"1:2:1:2 / 1:4:1:2"},
      {name:"Push Ups", sets:"×failure"},
    ],
    biceps:[
      {name:"Machine Preacher Curl", sets:"12, 10, 8, 8"},
      {name:"Barbell Curl (outside shoulder)", sets:"4×10"},
      {name:"Seated Barbell Curl", sets:"4×8"},
      {name:"DB Hammer Curl / Reverse Barbell Curl", sets:"4×15/12", tempo:"1:2:1:2 / 1:4:1:2"},
    ]
  },
];

let activeIdx = 0;
const checkState = {};




function render() {
  const w = WORKOUTS[activeIdx];
  const tabsHtml = WORKOUTS.map((wo,i) => `<button class="tab ${i===activeIdx?'active':''}" data-i="${i}">${wo.label}</button>`).join("");
  document.getElementById("app").innerHTML = `
    <div class="header">
      <a href="cat-pump-new4.html" class="back-link">← Back</a>
      <div class="header-inner">
        <div class="eyebrow">🔶 Split #3 · Push</div>
        <div class="title">Chest & Biceps</div>
        <div><span class="schedule">2 Workout Variations</span></div>
      </div>
    </div>
    <div class="tabs-bar"><div class="tabs">${tabsHtml}</div></div>
    <div class="content">
      <div class="workout-title">${escapeHtml(w.title)}</div>
      <div class="tap-hint">Tap any exercise to check off</div>
      <div class="section-label chest">Chest</div>${w.chest.map((e,i)=>renderEx(e,'c',i)).join("")}
      <div class="section-label biceps">Biceps</div>${w.biceps.map((e,i)=>renderEx(e,'b',i)).join("")}
    </div>`;
  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => { activeIdx=parseInt(b.dataset.i); render(); }));
  document.querySelectorAll(".ex-card").forEach(c => c.addEventListener("click", () => { const id=c.dataset.id; checkState[id]=!checkState[id]; c.classList.toggle("checked"); }));
}
render();
if(typeof updateProgress!=="undefined")updateProgress();




</script>
