let activePhase = "p1";
let activeDay = "d1";
let activeWeek = 0;

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}


function render(){
  const phase = PROGRAM[activePhase];
  const day = phase.days[activeDay];
  const weekHeader = day.weekHeaders[activeWeek];

  const liftsHtml = day.lifts.map((lift, li) => {
    if (lift.pick) {
      return `<div class="lift-card">
        <div class="lift-header"><div class="lift-name">${escapeHtml(lift.name)}</div></div>
        <div class="bicep-calf">${escapeHtml(lift.name)} <span class="you-pick-pill">You Pick</span></div>
      </div>`;
    }
    if (lift.header) {
      const text = lift.sets[0][activeWeek];
      return `<div class="lift-card">
        <div class="lift-header"><div class="lift-name">${escapeHtml(lift.name)}</div><div class="lift-meta">${escapeHtml(text)}</div></div>
      </div>`;
    }
    // K-1.5/G-04: this used to render its own interactive .set-row list with
    // a checkState object that lived in memory only — never written to
    // mc_setlog_v1, so mc-finish.js always counted PSU lifts as 0/0 and
    // nothing here synced, backed up, or fed the weight-suggestion/PR
    // engines the way every other page's logging does. Migrated onto the
    // shared mc-setlog.js engine instead: adding .ex-card is enough for
    // run() to build a real .mcl-strip/.mcl-wrap logger here (mc-setlog.js
    // already special-cases PSU's no-data-id .lift-card markup via
    // nameId() — see the comment at the top of run()), and .lift-name /
    // .lift-meta are already selectors mc-setlog.js reads directly. The
    // hidden [data-field="sets"] node feeds it a real per-week, per-set reps
    // scheme (mc-setlog.js's existing comma-list grammar, e.g. "12,10,8,8" —
    // the same notation the Modality Matrix's pyramid weeks already use) so
    // each row's reps ghost the true prescribed target instead of a generic
    // count parsed from "5 sets".
    //
    // mc-setlog.js has no concept of a per-set PRESCRIBED WEIGHT (only
    // history-based ghosting) — per owner decision (AskUserQuestion, Wave 3)
    // that exact number is kept visible in a small read-only "Coach's
    // Targets" reference strip above the real logger, renumbered 1..N to
    // match the logger's own rows one-to-one (a week with a "—" cell prints
    // fewer targets that week, same as the original set-row list did).
    const cells = lift.sets
      .map((row) => row[activeWeek] || "")
      .filter((c) => c && c !== "—");
    if (!cells.length) {
      // Nothing prescribed for this lift this week (e.g. a deload) — same
      // informational-only treatment as a `header` lift above; no logger.
      return `<div class="lift-card">
        <div class="lift-header"><div class="lift-name">${escapeHtml(lift.name)}</div><div class="lift-meta">${escapeHtml(lift.scheme)}</div></div>
      </div>`;
    }
    const targets = cells.map((cellRaw, i) => {
      // Parse "(5X) 135" format
      const match = cellRaw.match(/^\(([^)]+)\)\s*(.*)$/);
      const reps = match ? match[1] : cellRaw;
      const weight = match ? (match[2].trim() || "—") : "—";
      return { n: i + 1, reps, weight };
    });
    const repsCsv = targets.map((t) => t.reps.replace(/[^\d]/g, "") || "1").join(",");
    const targetsHtml = `<div class="lift-targets">${targets.map((t) =>
      `<span class="lift-target"><span class="lift-target-n">${t.n}</span>${escapeHtml(t.reps)}${t.weight !== "—" ? " · " + escapeHtml(t.weight) : ""}</span>`
    ).join("")}</div>`;
    // NOTE: [data-field="sets"] must come before .lift-meta in DOCUMENT ORDER
    // — mc-setlog.js's setsOf() does card.querySelector('.ex-sets,
    // [data-field="sets"], .notes-row, .lift-meta'), and a combined selector
    // list resolves to whichever alternative appears FIRST IN THE DOM, not
    // by priority in the selector list. Placed after .lift-meta (its natural
    // spot, inside .lift-header, which renders first) it silently lost to
    // .lift-meta's own text every time, ghosting every row with the same
    // stray leading digit pulled out of the display string instead of that
    // row's real per-week reps target.
    return `<div class="lift-card ex-card">
      <div data-field="sets" style="display:none">${escapeHtml(repsCsv)}</div>
      <div class="lift-header"><div class="lift-name">${escapeHtml(lift.name)}</div><div class="lift-meta">${escapeHtml(lift.scheme)}</div></div>
      <div style="padding:4px 0;">${makeRestTimer(lift.rest||"90-120 sec",lift.name)}</div>
      ${targetsHtml}
    </div>`;
  }).join("");

  const dayTabs = Object.keys(phase.days).map(dk => {
    const d = phase.days[dk];
    const num = dk.replace("d","");
    return `<button class="day-tab ${dk===activeDay?'active':''}" data-day="${dk}">Day ${num}</button>`;
  }).join("");

  const weekBtns = day.weekHeaders.map((wh, i) =>
    `<button class="day-tab ${i===activeWeek?'active':''}" data-week="${i}">${wh}</button>`
  ).join("");

  document.getElementById("app").innerHTML = `
    <div class="header">
      <a href="cat-psu.html" class="back-link">← Back</a>
      <div class="header-inner">
        <div class="eyebrow">🦁 PSU Football</div>
        <div class="title">Strength Training</div>
        <div><span class="schedule">${phase.weeks} · 4 Days/wk</span></div>
      </div>
    </div>
    <div class="phase-tabs"><div class="phase-tabs-inner">
      <button class="phase-tab ${activePhase==='p1'?'active':''}" data-phase="p1">Phase 1</button>
      <button class="phase-tab ${activePhase==='p2'?'active':''}" data-phase="p2">Phase 2</button>
    </div></div>
    <div class="day-tabs"><div class="day-tabs-inner">${dayTabs}</div></div>
    <div class="day-tabs" style="background:#01102a"><div class="day-tabs-inner">${weekBtns}</div></div>
    <div class="content">
      <div class="week-banner"><strong>${phase.label} · ${escapeHtml(day.label)}</strong><br/>${phase.note}</div>
      <div class="legend"><strong>Reading the chart:</strong> (5X) = 5 reps · Weight in pounds · Tap any set to mark complete</div>
      ${liftsHtml}
    </div>`;

  document.querySelectorAll(".phase-tab").forEach(b => b.addEventListener("click", () => {
    activePhase = b.dataset.phase; activeWeek = 0; render();
  }));
  document.querySelectorAll("[data-day]").forEach(b => b.addEventListener("click", () => {
    activeDay = b.dataset.day; render();
  }));
  document.querySelectorAll("[data-week]").forEach(b => b.addEventListener("click", () => {
    activeWeek = parseInt(b.dataset.week); render();
  }));
  // K-1.5/G-04: no .set-row click wiring here anymore — mc-setlog.js's
  // shared MC_SCAN-driven observer sees this innerHTML rebuild and builds
  // the real logger onto every .ex-card on its own.
}

render();
if(typeof updateProgress!=="undefined")updateProgress();
